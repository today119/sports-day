// ════════════════════════════════════════════════════════
//  TugBracket: 줄다리기 5팀 시드 추첨 + 대진 관리
// ════════════════════════════════════════════════════════
function TugBracket({state, update}) {
  const sel = "줄다리기";
  const br = state.brackets?.[sel] || {};
  const seeds = br.seeds || [];

  const [pickedSeeds, setPickedSeeds] = useState([]);
  const [drawing, setDrawing] = useState(false);
  const [spinTeam, setSpinTeam] = useState(null);
  const spinTimer = useRef(null);
  const [manualMode, setManualMode] = useState(false);
  const [editingSeed, setEditingSeed] = useState(null);

  const availTeams = TEAM_NAMES.filter(t => !pickedSeeds.includes(t));

  const startSpin = () => {
    if(availTeams.length===0) return;
    setDrawing(true);
    setSpinTeam(availTeams[0]);
    let i=0;
    spinTimer.current = setInterval(()=>{
      i=(i+1)%availTeams.length;
      setSpinTeam(availTeams[i]);
    }, 80);
  };
  const stopSpin = () => {
    if(!spinTimer.current) return;
    clearInterval(spinTimer.current); spinTimer.current=null;
    const final = spinTeam;
    setDrawing(false);
    setPickedSeeds(prev => [...prev, final]);
    setSpinTeam(null);
  };
  const finalize = () => {
    update(s=>({ ...s, brackets:{ ...(s.brackets||{}),
      [sel]:{ drawn:true, seeds:pickedSeeds, results:{} } } }));
    setPickedSeeds([]);
  };
  const resetDraw = () => {
    setPickedSeeds([]); setSpinTeam(null);
    if(spinTimer.current){ clearInterval(spinTimer.current); spinTimer.current=null; }
    setDrawing(false);
  };
  const resetAll = () => {
    if(!confirm("줄다리기 대진을 초기화하시겠습니까?")) return;
    update(s=>({ ...s, brackets:{ ...(s.brackets||{}), [sel]:{} } }));
    resetDraw();
  };
  const manualAssign = (idx, team) => {
    setPickedSeeds(prev => {
      const next = [...prev];
      const existIdx = next.indexOf(team);
      if(existIdx>=0) next[existIdx] = undefined;
      next[idx] = team;
      return next;
    });
  };

  // 이미 추첨 완료 → 대진 관리
  if(seeds.length===5) {
    const results = br.results || {};
    const pickWinner = (matchId, team) => update(s=>({
      ...s, brackets:{ ...(s.brackets||{}),
        [sel]:{ ...br, results:{ ...(br.results||{}),
          [matchId]: br.results?.[matchId]===team?null:team }}}}));
    return (
      <div>
        <div className="card" style={{background:"#f0fdf4",borderColor:"#bbf7d0",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>✅</span>
            <span style={{fontWeight:700,color:"#15803d",flex:1}}>추첨 완료 · 매치 결과 입력</span>
            <button onClick={resetAll} className="obtn" style={{fontSize:11,padding:"4px 8px"}}>
              🔄 초기화
            </button>
          </div>
        </div>

        <TugTreeSVG seeds={seeds} results={results} onPick={pickWinner}/>

        <div className="card" style={{background:"#eff6ff",borderColor:"#bfdbfe",marginTop:10}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1d4ed8",marginBottom:6}}>📊 점수 산정</div>
          <div style={{fontSize:12,color:"#1e40af",lineHeight:1.7}}>
            🥇 1위 100점 · 🥈 2위 90점 · 🥉 3위 80점 · 4위 80점 · 5위 50점
          </div>
        </div>
      </div>
    );
  }

  // 추첨 화면 - 시안 SVG 사용
  const allPicked = pickedSeeds.length===5 && pickedSeeds.every(s=>s);
  // 미완성 시드(undefined 포함)도 SVG에 그대로 표시되도록 5칸 배열로 만듦
  const seedsForSVG = [];
  for(let i=0; i<5; i++) {
    seedsForSVG[i] = pickedSeeds[i] || (drawing && pickedSeeds.length===i ? spinTeam : null);
  }

  return (
    <div className="card" style={{background:"#fffbeb",borderColor:"#fde68a",padding:14}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <span style={{fontSize:18}}>🎰</span>
        <span style={{fontWeight:800,fontSize:14,color:"#92400e",flex:1}}>
          줄다리기 5팀 시드 추첨 ({pickedSeeds.filter(s=>s).length}/5)
        </span>
        <button onClick={()=>setManualMode(v=>!v)} className="obtn" style={{fontSize:11,padding:"4px 8px"}}>
          {manualMode?"🎰 룰렛":"✋ 수동"}
        </button>
      </div>

      {/* 시안 SVG로 표시 (추첨 진행 중에도) */}
      <div style={{marginBottom:14}}>
        <TugTreeSVG seeds={seedsForSVG} results={{}} onPick={null}/>
      </div>

      {/* 수동 모드: 시드 클릭으로 팀 배정 */}
      {manualMode && (
        <div style={{padding:12,background:"#fff",borderRadius:8,border:"1px solid #e7e7e5",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:"#37352f"}}>
            시드 번호 선택 → 팀 배정
          </div>
          <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {[0,1,2,3,4].map(idx=>(
              <button key={idx} onClick={()=>setEditingSeed(idx)}
                style={{padding:"6px 12px",borderRadius:6,
                  border:`1.5px solid ${editingSeed===idx?"#f59e0b":"#e7e7e5"}`,
                  background:editingSeed===idx?"#fef3c7":"#fff",
                  color:"#37352f",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit"}}>
                {idx+1}번 {pickedSeeds[idx]?`(${pickedSeeds[idx]})`:""}
              </button>
            ))}
          </div>
          {editingSeed!==null && (
            <>
              <div style={{fontSize:12,fontWeight:700,marginBottom:6,color:"#37352f"}}>
                {editingSeed+1}번 시드에 배정할 팀:
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {TEAM_NAMES.map(t=>{
                  const elsewhere = pickedSeeds.includes(t) && pickedSeeds[editingSeed]!==t;
                  return(
                    <button key={t} onClick={()=>{manualAssign(editingSeed,t);setEditingSeed(null);}}
                      disabled={elsewhere}
                      style={{padding:"8px 14px",borderRadius:6,
                        border:`1.5px solid ${pickedSeeds[editingSeed]===t?TEAM_COLORS[t]:"#e7e7e5"}`,
                        background:pickedSeeds[editingSeed]===t?TEAM_COLORS[t]:elsewhere?"#f9fafb":"#fff",
                        color:pickedSeeds[editingSeed]===t?"#fff":elsewhere?"#d1d5db":"#37352f",
                        cursor:elsewhere?"not-allowed":"pointer",
                        fontWeight:700,fontSize:13,fontFamily:"inherit"}}>
                      {t}팀
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}

      {/* 룰렛 모드 버튼 */}
      {!manualMode && (
        <div style={{display:"flex",gap:6}}>
          {!drawing && pickedSeeds.length<5 && (
            <button onClick={startSpin} className="obtn primary"
              style={{flex:1,padding:"14px 0",fontSize:15,fontWeight:900}}>
              🎰 {pickedSeeds.length+1}번 시드 추첨 시작!
            </button>
          )}
          {drawing && (
            <button onClick={stopSpin}
              style={{flex:1,padding:"14px 0",fontSize:15,fontWeight:900,
                background:"#eb5757",color:"#fff",border:"none",borderRadius:8,
                cursor:"pointer",fontFamily:"inherit"}}>
              ✋ 멈춰!
            </button>
          )}
        </div>
      )}

      {allPicked && (
        <div style={{display:"flex",gap:6,marginTop:10}}>
          <button onClick={resetDraw} className="obtn" style={{flex:1}}>🔄 다시</button>
          <button onClick={finalize} className="obtn primary"
            style={{flex:2,fontWeight:900,padding:"12px 0"}}>
            ✅ 이 대진으로 확정
          </button>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  TugTreeSVG: 줄다리기 세로 대진표 (아래→위: 1라운드→준결승→결승)
// ════════════════════════════════════════════════════════
function TugTreeSVG({seeds, results, onPick}) {
  const computed = seeds.length===5
    ? compute5SpecialBracket(seeds, results||{})
    : {matches:[{a:null,b:null,winner:null},{a:null,b:null,winner:null},
                {a:null,b:null,winner:null},{a:null,b:null,winner:null}], ranks:{}};
  const { matches } = computed;
  const [m1, sf1, sf2, mF] = matches;

  // 팀 박스 컴포넌트
  const TeamRow = ({team, label, isWinner, isLoser, seedNum, canPick, matchId, isFinalWinner}) => {
    const bg = isFinalWinner?"#fef9c3":isWinner?"#f0fdf4":"#fff";
    const bc = isFinalWinner?"#facc15":isWinner?"#22c55e":"#e5e7eb";
    const col = isFinalWinner?"#854f0b":isWinner?"#15803d":isLoser?"#9ca3af":"#1f2937";
    const fw = isWinner||isFinalWinner?800:isLoser?400:600;
    const teamColor = team ? TEAM_COLORS[team] : null;
    return (
      <div onClick={()=>canPick&&team&&onPick&&onPick(matchId,team)}
        style={{display:"flex",alignItems:"center",gap:8,padding:"9px 11px",
          background:bg,border:`1.5px solid ${bc}`,borderRadius:7,marginBottom:4,
          cursor:canPick&&team?"pointer":"default",userSelect:"none",
          transition:"all .15s"}}>
        {team && <div style={{width:8,height:8,borderRadius:"50%",
          background:teamColor,flexShrink:0}}/>}
        <span style={{flex:1,fontSize:14,fontWeight:fw,color:col,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {isFinalWinner&&"🏆 "}{team?`${team}팀`:label}
        </span>
        {seedNum && (
          <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,
            background:isFinalWinner?"#facc15":isWinner?"#bef264":"#d4d4d4",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:11,fontWeight:700,color:"#1f2937"}}>
            {seedNum}
          </div>
        )}
        {(isWinner||isFinalWinner)&&team&&(
          <span style={{fontSize:11,color:"#16a34a",flexShrink:0,fontWeight:700}}>✓</span>
        )}
      </div>
    );
  };

  // 라운드 헤더
  const RoundHeader = ({label, isFinal}) => (
    <div style={{textAlign:"center",marginBottom:10,marginTop:6}}>
      <span style={{display:"inline-block",padding:"5px 22px",borderRadius:20,
        background:isFinal?"#0f172a":"#fff",
        border:`1px solid ${isFinal?"#0f172a":"#e5e7eb"}`,
        fontSize:13,fontWeight:700,color:isFinal?"#fff":"#1f2937",
        letterSpacing:".3px"}}>
        {label}
      </span>
    </div>
  );

  // 연결 화살표
  const Arrow = ({left}) => (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,
      padding:"2px 0",textAlign:"center",lineHeight:1}}>
      <div style={{color:"#94a3b8",fontSize:20,fontWeight:300}}>↑</div>
      <div style={{color: left?"transparent":"#94a3b8",fontSize:20,fontWeight:300}}>↑</div>
    </div>
  );

  return (
    <div style={{background:"#fff",borderRadius:10,border:"1px solid #e7e7e5",
      padding:"14px 12px",fontFamily:"inherit"}}>

      {/* ══ 결승 (최상단) ══ */}
      <RoundHeader label="결승" isFinal/>
      <div style={{padding:"0 12px",marginBottom:2}}>
        <TeamRow team={sf1.winner} label="준결승 ① 승자"
          isFinalWinner={mF.winner&&mF.winner===sf1.winner}
          isLoser={mF.winner&&sf1.winner&&mF.winner!==sf1.winner}
          canPick={!mF.winner&&sf1.winner&&sf2.winner} matchId="f"/>
        <TeamRow team={sf2.winner} label="준결승 ② 승자"
          isFinalWinner={mF.winner&&mF.winner===sf2.winner}
          isLoser={mF.winner&&sf2.winner&&mF.winner!==sf2.winner}
          canPick={!mF.winner&&sf1.winner&&sf2.winner} matchId="f"/>
      </div>

      {/* 결승←준결승 연결선 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,
        padding:"4px 0",textAlign:"center",lineHeight:1}}>
        <div style={{color:"#94a3b8",fontSize:20}}>↑</div>
        <div style={{color:"#94a3b8",fontSize:20}}>↑</div>
      </div>

      {/* ══ 준결승 (두 열) ══ */}
      <RoundHeader label="준결승"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:2}}>

        {/* 준결승 ① (왼쪽) */}
        <div style={{background:"#f8fafc",borderRadius:8,padding:"8px 8px 4px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",
            textAlign:"center",marginBottom:6,letterSpacing:".5px"}}>준결승 ①</div>
          <TeamRow team={seeds[0]} label="1번 시드" seedNum="1"
            isWinner={sf1.winner===seeds[0]}
            isLoser={sf1.winner&&sf1.winner!==seeds[0]}
            canPick={!sf1.winner&&seeds[0]&&m1.winner} matchId="sf1"/>
          {seeds[0]&&!sf1.winner&&(
            <div style={{fontSize:10,color:"#94a3b8",fontStyle:"italic",
              textAlign:"center",marginBottom:4,marginTop:-2}}>부전승</div>
          )}
          <TeamRow team={m1.winner} label="1라운드 승자" seedNum="?"
            isWinner={sf1.winner&&sf1.winner===m1.winner}
            isLoser={sf1.winner&&m1.winner&&sf1.winner!==m1.winner}
            canPick={!sf1.winner&&seeds[0]&&m1.winner} matchId="sf1"/>
        </div>

        {/* 준결승 ② (오른쪽) */}
        <div style={{background:"#f8fafc",borderRadius:8,padding:"8px 8px 4px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",
            textAlign:"center",marginBottom:6,letterSpacing:".5px"}}>준결승 ②</div>
          <TeamRow team={seeds[3]} label="4번 시드" seedNum="4"
            isWinner={sf2.winner===seeds[3]}
            isLoser={sf2.winner&&sf2.winner!==seeds[3]}
            canPick={!sf2.winner&&seeds[3]&&seeds[4]} matchId="sf2"/>
          <TeamRow team={seeds[4]} label="5번 시드" seedNum="5"
            isWinner={sf2.winner===seeds[4]}
            isLoser={sf2.winner&&seeds[4]&&sf2.winner!==seeds[4]}
            canPick={!sf2.winner&&seeds[3]&&seeds[4]} matchId="sf2"/>
        </div>
      </div>

      {/* 준결승①←1라운드 연결선 (왼쪽만) */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,
        padding:"4px 0",lineHeight:1}}>
        <div style={{textAlign:"center",color:"#94a3b8",fontSize:20}}>↑</div>
        <div/>
      </div>

      {/* ══ 1라운드 (최하단) ══ */}
      <RoundHeader label="1라운드"/>
      <div style={{padding:"0 12px"}}>
        <div style={{background:"#f8fafc",borderRadius:8,padding:"8px 8px 4px"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",
            textAlign:"center",marginBottom:6,letterSpacing:".5px"}}>2번 vs 3번 시드</div>
          <TeamRow team={seeds[1]} label="2번 시드" seedNum="2"
            isWinner={m1.winner===seeds[1]}
            isLoser={m1.winner&&m1.winner!==seeds[1]}
            canPick={!m1.winner&&seeds[1]&&seeds[2]} matchId="m1"/>
          <TeamRow team={seeds[2]} label="3번 시드" seedNum="3"
            isWinner={m1.winner===seeds[2]}
            isLoser={m1.winner&&seeds[2]&&m1.winner!==seeds[2]}
            canPick={!m1.winner&&seeds[1]&&seeds[2]} matchId="m1"/>
        </div>
      </div>
    </div>
  );
}


function GroupBracketSVG({ groupAssignment, sport, results }) {
  // 깔끔 스타일 HTML 카드 (반응형: PC 4열 / 태블릿 2열 / 모바일 1열)
  const groups = ["g1","g2","g3","g4"];
  const labels = {g1:"1학년 1조", g2:"1학년 2조", g3:"2학년 1조", g4:"2학년 2조"};

  // 각 학급에 들어간 순위(1~5위) 계산
  return (
    <div className="group-bracket-grid">
      {groups.map(gk=>{
        const cls = groupAssignment[gk] || [];
        const ranks = results?.[gk] || {};
        return (
          <div key={gk} className="group-card">
            {/* 알약 헤더 */}
            <div className="group-card-header">
              <span>{labels[gk]}</span>
            </div>
            {/* 5위 슬롯 - 순위가 입력된 학급이 해당 위치로 정렬됨 */}
            {[1,2,3,4,5].map(rank=>{
              // 이 순위에 해당하는 학급 찾기
              const cl = Object.entries(ranks).find(([c,r])=>r===rank)?.[0];
              const fallback = cl ? null : cls[rank-1]; // 미입력 시 기본 학급
              const targetCls = cl || fallback;
              const team = targetCls ? classToTeam(targetCls) : null;
              const isFilled = !!cl;
              const isPodium = isFilled && rank<=3;
              return (
                <div key={rank}
                  className={`group-slot ${isFilled?"filled":""} ${isPodium?"podium":""}`}>
                  <span className="group-slot-name" style={{color: team?TEAM_COLORS[team]:"#9ca3af"}}>
                    {targetCls ? `${targetCls}반` : "—"}
                  </span>
                  <span className={`group-rank-chip ${isFilled?"on":""}`}>{rank}</span>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}


function GroupDraw({state, update}) {
  const [sport, setSport] = useState("장애물달리기");
  const drawn = state.groupDraws?.[sport] || {};
  const groupScores = state.groupScores?.[sport] || {};

  const [showing, setShowing] = useState("draw"); // draw | score
  const [drawing, setDrawing] = useState(false);
  const [picked, setPicked] = useState({});
  const spinRef = useRef(null);

  // 기본 조 편성
  const DEFAULT_GROUPS = {
    g1:{name:"1학년 A조 (1~5반)", cls:["1-1","1-2","1-3","1-4","1-5"]},
    g2:{name:"1학년 B조 (6~10반)", cls:["1-6","1-7","1-8","1-9","1-10"]},
    g3:{name:"2학년 A조 (1~5반)", cls:["2-1","2-2","2-3","2-4","2-5"]},
    g4:{name:"2학년 B조 (6~10반)", cls:["2-6","2-7","2-8","2-9","2-10"]},
  };

  // 태풍의눈 기본 편성 (5조×4학급, 같은팀 같은조 없음)
  const TYP_DEFAULT = {
    g1:["1-1","1-4","2-2","2-7"], g2:["1-2","1-5","2-3","2-8"],
    g3:["1-3","1-6","2-4","2-9"], g4:["1-7","1-9","2-1","2-5"],
    g5:["1-8","1-10","2-6","2-10"],
  };
  const TYP_GRP_NAMES = {g1:"1조",g2:"2조",g3:"3조",g4:"4조",g5:"5조"};

  const isTyp = sport === "태풍의눈";
  const CUR_KEYS = isTyp ? TYP_KEYS : GRP_KEYS;
  const CUR_PTS  = isTyp ? TYP_PTS  : GRP_PTS;
  const RANK_MAX = isTyp ? 4 : 5;

  const reshuffle = () => {
    if(isTyp) {
      // 5조 × 4학급: 각 팀 4학급을 4개 조에 1개씩 배정 (5번째 조엔 배정 안 됨, 순환)
      // 팀i → 그룹 (i+j)%5 에 j번째 학급 배정 (j=0..3)
      const result = {g1:[],g2:[],g3:[],g4:[],g5:[]};
      const keys = ["g1","g2","g3","g4","g5"];
      TEAM_NAMES.forEach((team, ti) => {
        const cls = [...(TEAM_MAP[team]||[])].sort(()=>Math.random()-0.5);
        cls.slice(0,4).forEach((c, j) => {
          result[keys[(ti + j) % 5]].push(c);
        });
      });
      // 각 조 레인 순서 셔플
      for(const gk of keys) {
        for(let i=result[gk].length-1;i>0;i--) {
          const j=Math.floor(Math.random()*(i+1));
          [result[gk][i],result[gk][j]]=[result[gk][j],result[gk][i]];
        }
      }
      return result;
    } else {
      // 기존 4조 × 5학급 로직 (장애물달리기/계주)
      const result = { g1:[], g2:[], g3:[], g4:[] };
      for(const grade of ["1","2"]) {
        const [groupA, groupB] = grade==="1" ? ["g1","g2"] : ["g3","g4"];
        for(const team of TEAM_NAMES) {
          const inGrade = (TEAM_MAP[team]||[]).filter(c=>c.startsWith(grade+"-"));
          if(inGrade.length===0) continue;
          const shuffled = [...inGrade].sort(()=>Math.random()-0.5);
          result[groupA].push(shuffled[0]);
          if(shuffled[1]) result[groupB].push(shuffled[1]);
        }
        for(const gk of [groupA, groupB]) {
          for(let i=result[gk].length-1;i>0;i--) {
            const j=Math.floor(Math.random()*(i+1));
            [result[gk][i],result[gk][j]]=[result[gk][j],result[gk][i]];
          }
        }
      }
      return result;
    }
  };

  const startSpin = () => {
    setDrawing(true);
    const target = reshuffle();
    let cnt = 0;
    spinRef.current = setInterval(()=>{
      setPicked(reshuffle());
      cnt++;
      if(cnt>=20) {
        clearInterval(spinRef.current); spinRef.current=null;
        setPicked(target); setDrawing(false);
      }
    }, 100);
  };

  const finalize = () => {
    update(s=>({ ...s, groupDraws:{ ...(s.groupDraws||{}), [sport]: picked } }));
    setPicked({});
    alert("✅ 조 편성이 확정되었습니다");
  };

  const reset = () => {
    if(!confirm(`${sport} 조 편성을 초기화하시겠습니까?`)) return;
    update(s=>{
      const next = {...(s.groupDraws||{})};
      delete next[sport];
      return {...s, groupDraws:next};
    });
    setPicked({});
  };

  // 순위 설정
  const setRank = (gk, cls, rank) => {
    update(s=>{
      const gs = {...(s.groupScores||{})};
      const sg = {...(gs[sport]||{})};
      const grp = {...(sg[gk]||{})};
      if(rank===null || rank==="") delete grp[cls];
      else grp[cls] = parseInt(rank);
      sg[gk] = grp;
      gs[sport] = sg;
      return {...s, groupScores:gs};
    });
  };

  // display: 항상 { g1:[...], ... } 배열 형태
  const defaultDisp = isTyp ? TYP_DEFAULT
    : { g1:DEFAULT_GROUPS.g1.cls, g2:DEFAULT_GROUPS.g2.cls,
        g3:DEFAULT_GROUPS.g3.cls, g4:DEFAULT_GROUPS.g4.cls };
  const display = Object.keys(picked).length>0 ? picked
    : Object.keys(drawn).length>0 ? drawn
    : defaultDisp;
  const hasDrawn = Object.keys(drawn).length > 0;
  const hasPicked = Object.keys(picked).length > 0;

  // 점수 산정 (계주는 다른 로직)
  const isRelay = sport === "계주";
  const PTS = isRelay ? null : CUR_PTS;

  return(<>
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {GRP_SPORTS.concat(["계주"]).map(sp=>(
        <button key={sp} onClick={()=>{setSport(sp);setPicked({});setShowing("draw");}}
          className={`obtn${sport===sp?" on":""}`} style={{flex:1,padding:"10px 0",fontSize:13}}>
          {sp==="장애물달리기"?"🚧":sp==="태풍의눈"?"🌀":"🏃"} {sp}
        </button>
      ))}
    </div>

    {/* 추첨/점수 모드 토글 (항상 표시) */}
    <div style={{display:"flex",gap:6,marginBottom:10}}>
      <button onClick={()=>setShowing("draw")}
        className={`obtn${showing==="draw"?" on":""}`} style={{flex:1,fontSize:13,padding:"10px 0"}}>
        🎰 조 편성·추첨
      </button>
      <button onClick={()=>setShowing("score")}
        className={`obtn${showing==="score"?" on":""}`} style={{flex:1,fontSize:13,padding:"10px 0"}}>
        🏅 순위 입력
      </button>
    </div>

    {showing==="draw" ? (<>
      <div className="card" style={{background:"#eff6ff",borderColor:"#bfdbfe",marginBottom:10,padding:"10px 14px"}}>
        <div style={{fontSize:12,color:"#1e40af",lineHeight:1.7}}>
          <b>{sport}</b> 진행 방식<br/>
          {isRelay ? (
            <>학년별 2조 예선 → 각 조 1·2위 결승 (학년별 4팀)<br/>
            결승 1위 100 · 2위 80 · 3위 60 · 4위 40 / 예선탈락 동일 30점</>
          ) : isTyp ? (
            <>5개 조 · 각 조 4학급 · 조 내 1~4위 차등 점수<br/>
            1위 100 · 2위 90 · 3위 80 · 4위 70 / 같은 팀 학급은 다른 조</>
          ) : (
            <>학년별 2조 · 각 조 5팀 · 조 내 1~5위 차등 점수<br/>
            1위 100 · 2위 90 · 3위 80 · 4위 70 · 5위 60</>
          )}
        </div>
      </div>

      {/* 대진표 SVG 시각화 (이미지 스타일) */}
      <div style={{marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:800,color:"#37352f",marginBottom:8,
          display:"flex",alignItems:"center",gap:8}}>
          <span>🏃</span><span>{sport} 대진표</span>
        </div>
        <GroupBracketSVG
          groupAssignment={display}
          sport={sport}
          results={state.groupScores?.[sport]||{}}/>
      </div>

      {hasDrawn && !hasPicked ? (
        <div style={{display:"flex",gap:6}}>
          <button onClick={reset} className="obtn danger" style={{flex:1}}>🔄 초기화</button>
          <button onClick={()=>setShowing("score")} className="obtn primary" style={{flex:2}}>
            🏅 순위 입력으로 이동 →
          </button>
        </div>
      ) : (
        <>
          <button onClick={startSpin} disabled={drawing}
            className="obtn primary" style={{width:"100%",padding:14,fontSize:14,fontWeight:800}}>
            {drawing?"🎰 추첨 중...":"🎰 레인 추첨 시작"}
          </button>
          {hasPicked && !drawing && (
            <button onClick={finalize} className="obtn primary"
              style={{width:"100%",padding:12,fontSize:14,marginTop:6,background:"#16a34a"}}>
              ✅ 이 편성으로 확정
            </button>
          )}
        </>
      )}
    </>) : (
      <>
        {/* 순위 입력 모드 */}
        <div className="card" style={{background:"#eff6ff",borderColor:"#bfdbfe",marginBottom:10,padding:"10px 14px"}}>
          <div style={{fontSize:12,color:"#1e40af",lineHeight:1.6}}>
            👇 각 학급별로 1~{RANK_MAX}위 버튼 클릭하여 순위 입력
            {PTS && <div style={{marginTop:2,fontSize:11}}>{PTS.map((p,i)=>`${i+1}위 ${p}점`).join(' · ')}</div>}
          </div>
        </div>

        {/* 순위 초기화 버튼 */}
        {Object.keys(groupScores).length>0 && (
          <div style={{marginBottom:10}}>
            <button onClick={()=>{
              if(!confirm(`${sport}의 입력한 모든 순위를 초기화할까요?`)) return;
              update(s=>{
                const next = {...(s.groupScores||{})};
                delete next[sport];
                return {...s, groupScores:next};
              });
              alert("✅ 순위 초기화 완료");
            }} className="obtn danger" style={{width:"100%",padding:"9px 0",fontSize:13,
              background:"#fef2f2",color:"#dc2626",border:"1.5px solid #fca5a5"}}>

        {CUR_KEYS.map(gk=>{
          const list = drawn[gk] || (isTyp ? TYP_DEFAULT[gk] : DEFAULT_GROUPS[gk]?.cls || []);
          const grpName = isTyp ? TYP_GRP_NAMES[gk] : DEFAULT_GROUPS[gk]?.name || gk;
          const grpScores = groupScores[gk] || {};
          return(

                {grpName}
              </div>
              {list.map((cls,i)=>{
                const team = classToTeam(cls);
                const rank = grpScores[cls];
                return(

                    padding:"8px 4px",borderBottom:i<list.length-1?"1px solid #f5f5f3":"none"}}>

                      {cls}반
                    </div>
                    <div style={{display:"flex",gap:3}}>
                      {Array.from({length:RANK_MAX},(_,i)=>i+1).map(r=>(
                        <button key={r} onClick={()=>setRank(gk,cls,rank===r?null:r)}
                          style={{
                            width:32,height:32,borderRadius:6,
                            border:`1.5px solid ${rank===r?TEAM_COLORS[team]:"#e7e7e5"}`,
                            background:rank===r?TEAM_COLORS[team]:"#fff",
                            color:rank===r?"#fff":"#37352f",
                            fontWeight:800,fontSize:13,cursor:"pointer",
                            fontFamily:"inherit"
                          }}>
                          {r}
                        </button>
                      ))}
                    </div>
                    {rank && PTS && (
                      <div style={{minWidth:40,fontSize:11,fontWeight:800,
                        color:TEAM_COLORS[team],textAlign:"right"}}>
                        +{PTS[rank-1]||0}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* 계주 결승 (학년별 1·2위만) */}
        {isRelay && <RelayFinalsInline state={state} update={update}/>}
      </>
    )}
  </>);
}

// 계주 결승 인라인
function RelayFinalsInline({state, update}) {
  const finals = state.relayFinals || {};
  const RELAY_FINAL_PTS = [100, 80, 60, 40];

  const setFinalRank = (grade, cls, rank) => {
    update(s=>{
      const rf = {...(s.relayFinals||{})};
      const gr = {...(rf[grade]||{})};
      if(rank===null) delete gr[cls];
      else gr[cls] = parseInt(rank);
      rf[grade] = gr;
      return {...s, relayFinals:rf};
    });
  };

  // 예선에서 각 조 1,2위만 결승 진출 (학년별 4팀)
  const elimScores = state.groupScores?.["계주"]||{};
  const grade1Finals = []; // 1학년 결승 진출팀
  const grade2Finals = [];
  for(const gk of ["g1","g2"]) {
    const grp = elimScores[gk]||{};
    Object.entries(grp).filter(([_,r])=>r<=2).forEach(([cls,r])=>grade1Finals.push({cls,prelim:r}));
  }
  for(const gk of ["g3","g4"]) {
    const grp = elimScores[gk]||{};
    Object.entries(grp).filter(([_,r])=>r<=2).forEach(([cls,r])=>grade2Finals.push({cls,prelim:r}));
  }

  return(
    <div className="card" style={{marginTop:14,padding:14,
      background:"linear-gradient(135deg,#fff7ed,#fef3c7)",borderColor:"#f59e0b"}}>
      <div style={{fontSize:14,fontWeight:900,color:"#92400e",marginBottom:10}}>
        🏆 계주 결승 (학년별 4팀)
      </div>
      {[
        {grade:"grade1",label:"1학년 결승",teams:grade1Finals},
        {grade:"grade2",label:"2학년 결승",teams:grade2Finals},
      ].map(g=>(
        <div key={g.grade} style={{marginBottom:10,padding:10,background:"#fff",borderRadius:8}}>
          <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>{g.label}</div>
          {g.teams.length===0 ? (
            <div style={{fontSize:11,color:"#9b9a97",fontStyle:"italic"}}>예선 입력 후 자동 표시</div>
          ) : g.teams.map(({cls,prelim})=>{
            const team = classToTeam(cls);
            const rank = finals[g.grade]?.[cls];
            return(
              <div key={cls} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 4px"}}>
                <TeamBadge team={team} size={26}/>
                <div style={{flex:1,fontWeight:700,fontSize:13}}>
                  {cls}반 <span style={{fontSize:10,color:"#9b9a97"}}>(예선 {prelim}위)</span>
                </div>
                <div style={{display:"flex",gap:3}}>
                  {[1,2,3,4].map(r=>(
                    <button key={r} onClick={()=>setFinalRank(g.grade,cls,rank===r?null:r)}
                      style={{width:30,height:30,borderRadius:6,
                        border:`1.5px solid ${rank===r?TEAM_COLORS[team]:"#e7e7e5"}`,
                        background:rank===r?TEAM_COLORS[team]:"#fff",
                        color:rank===r?"#fff":"#37352f",
                        fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                      {r}
                    </button>
                  ))}
                </div>
                {rank && (
                  <div style={{minWidth:40,fontSize:11,fontWeight:800,
                    color:TEAM_COLORS[team],textAlign:"right"}}>
                    +{RELAY_FINAL_PTS[rank-1]||0}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}


function OScore({state,update}) {
  const [sel,setSel]=useState(SPORTS[0]);
  const srank=state.scores?.[sel]||{};
  const groups=getRankGroups(SPORT_PTS[sel]||[]);
  const hasBracket=state.brackets?.[sel]?.drawn;

  const setRank=(cls,rank)=>update(s=>{
    const nr={...(s.scores[sel]||{})};
    for(const [c,r] of Object.entries(nr))if(r===rank&&c!==cls)delete nr[c];
    if(nr[cls]===rank)delete nr[cls];else nr[cls]=rank;
    return{...s,scores:{...s.scores,[sel]:nr}};
  });

  return(<>
    <div style={{display:"flex",overflowX:"auto",gap:6,paddingBottom:12,scrollbarWidth:"none"}}>
      {SPORTS.map(s=><button key={s} onClick={()=>setSel(s)} className={`pill${sel===s?" on":""}`}>{s}</button>)}
    </div>
    {hasBracket&&(
      <div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:10,padding:"10px 14px",marginBottom:12,
        fontSize:13,color:"#9a3412"}}>
        ⚠️ 이 종목은 대진표가 활성화되어 있어요. 점수는 대진표 결과로 자동 계산됩니다.
      </div>
    )}
    {TEAM_NAMES.map(team=>(<div key={team}>
      <div style={{display:"flex",alignItems:"center",gap:8,margin:"12px 0 6px"}}>
        <TeamBadge team={team} size={22}/>
        <span style={{fontWeight:700,fontSize:14,color:TEAM_COLORS[team]}}>{team}팀</span>
      </div>
      {TEAM_MAP[team].map(cls=>{
        const curRank=srank[cls];
        const curGroup=groups.find(g=>curRank>=g.rank&&curRank<=g.endRank);
        return(<div key={cls} className="card" style={{opacity:hasBracket?.6:1}}>
          <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:700,color:"#111827",flex:1}}>{cls}반</span>
            {curGroup&&<Chip color={TEAM_COLORS[team]} bg={TEAM_BG[team]}>{curGroup.label} {curGroup.pts}점</Chip>}
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {groups.map(g=>{const on=curRank>=g.rank&&curRank<=g.endRank;
              return(<button key={g.rank} onClick={()=>!hasBracket&&setRank(cls,g.rank)}
                className={`obtn${on?" on":""}`} style={{fontSize:12,padding:"5px 10px",
                  cursor:hasBracket?"not-allowed":"pointer",opacity:hasBracket?.7:1}}>
                {g.label}
              </button>);})}
          </div>
        </div>);
      })}
    </div>))}
  </>);
}

            </div>);
          })}
        </div>
      </>);
    })()}

}

function OSched({state,update}) {
  const [editId, setEditId] = useState(null);
  const [editTime, setEditTime] = useState("");
  const [editTitle, setEditTitle] = useState("");
  const [editEmoji, setEditEmoji] = useState("📌");

  const setStatus=(id,status)=>update(s=>({...s,
    schedule:s.schedule.map(i=>i.id===id?{...i,status}:i)}));

  const startEdit=(item)=>{
    setEditId(item.id);
    setEditTime(item.time);
    setEditTitle(item.title);
    setEditEmoji(item.emoji);
  };

  const saveEdit=()=>{
    if(!editTitle.trim()){alert("제목을 입력하세요");return;}
    update(s=>({...s,
      schedule:s.schedule.map(i=>i.id===editId?{
        ...i,time:editTime.trim(),title:editTitle.trim(),emoji:editEmoji.trim()||"📌"
      }:i)}));
    setEditId(null);
  };

  const cancelEdit=()=>setEditId(null);

  const deleteItem=(id)=>{
    if(!confirm("이 일정을 삭제하시겠습니까?"))return;
    update(s=>({...s,schedule:s.schedule.filter(i=>i.id!==id)}));
  };

  const moveItem=(id,dir)=>{
    update(s=>{
      const arr=[...s.schedule];
      const idx=arr.findIndex(i=>i.id===id);
      const ni=idx+dir;
      if(ni<0||ni>=arr.length) return s;
      [arr[idx],arr[ni]]=[arr[ni],arr[idx]];
      return {...s,schedule:arr};
    });
  };

  const addNewItem=()=>{
    const newId="s"+Date.now();
    update(s=>({...s,schedule:[...s.schedule,
      {id:newId,time:"00:00",title:"새 일정",emoji:"📌",status:"upcoming"}]}));
    // 추가 후 바로 편집 모드
    setTimeout(()=>{
      setEditId(newId);
      setEditTime("00:00");
      setEditTitle("새 일정");
      setEditEmoji("📌");
    },50);
  };

// ════════════════════════════════════════════════════════
//  조별 순위 종목 운영자 컴포넌트 (장애물달리기, 태풍의눈)
// ════════════════════════════════════════════════════════
function OGroupSport({ sport, state, update }) {
  const gs = state.groupScores?.[sport]||{};
  const [selGk, setSelGk] = useState("g1");

  const setRank = (gk, cls, rank) => update(s => {
    const cur = s.groupScores?.[sport]?.[gk]?.[cls];
    const newG = { ...(s.groupScores?.[sport]?.[gk]||{}) };
    if(cur===rank) delete newG[cls];
    else {
      // 같은 순위 이미 있으면 해제
      for(const [c,r] of Object.entries(newG)) { if(r===rank) delete newG[c]; }
      newG[cls] = rank;
    }
    return { ...s, groupScores:{ ...(s.groupScores||{}),
      [sport]:{ ...(s.groupScores?.[sport]||{}), [gk]:newG } } };
  });

  const grp = GRP_DEF[selGk];
  const gResult = gs[selGk]||{};
  const takenRanks = Object.values(gResult);
  const doneCount = GRP_KEYS.reduce((n,gk)=>n+Object.keys(gs[gk]||{}).length,0);

  return(<>
    <div className="page-title">{sport==="장애물달리기"?"🚧":"🌀"} {sport}</div>
    <div className="page-desc">
      4개 조 · 각 조 5개반 · 조 내 순위 입력 → 팀 점수 합산
    </div>
    <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,
      padding:"10px 14px",marginBottom:12,fontSize:13,color:"#1d4ed8"}}>
      배점: 1위 100pt · 2위 90pt · 3위 80pt · 4위 70pt · 5위 60pt<br/>
      <span style={{fontSize:11}}>총 {doneCount}/20개 반 입력 완료</span>
    </div>

    {/* 조 선택 탭 */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
      {GRP_KEYS.map(gk=>{
        const done = Object.keys(gs[gk]||{}).length;
        const g = GRP_DEF[gk];
        return (
          <button key={gk} onClick={()=>setSelGk(gk)}
            className={`obtn${selGk===gk?" on":""}`}
            style={{padding:"9px 8px",fontSize:13,display:"flex",
              flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontWeight:800}}>{g.name}</span>
            <span style={{fontSize:10,opacity:.8}}>{done}/5 입력</span>
          </button>
        );
      })}
    </div>

    {/* 순위 입력 */}
    <div style={{fontSize:12,color:"#9b9a97",marginBottom:8}}>
      {grp.name} ({grp.cls.join("반 ")}반) — 각 반의 순위를 선택하세요
    </div>
    {grp.cls.map(cls=>{
      const team = classToTeam(cls);
      const curRank = gResult[cls];
      return(
        <div key={cls} className="card" style={{marginBottom:6,padding:"10px 12px"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <TeamBadge team={team} size={24}/>
            <span style={{fontWeight:700,color:"#37352f",flex:1}}>{cls}반 ({team}팀)</span>
            {curRank&&<Chip color={TEAM_COLORS[team]} bg={TEAM_BG[team]}>
              {curRank}위 +{GRP_PTS[curRank-1]}pt
            </Chip>}
          </div>
          <div style={{display:"flex",gap:5}}>
            {[1,2,3,4,5].map(r=>{
              const isMine = curRank===r;
              const isTaken = takenRanks.includes(r)&&!isMine;
              return(
                <button key={r} onClick={()=>!isTaken&&setRank(selGk,cls,r)}
                  style={{flex:1,padding:"9px 0",borderRadius:6,border:"1.5px solid",
                    borderColor: isMine?TEAM_COLORS[team]:isTaken?"#f3f4f6":"#e7e7e5",
                    background: isMine?TEAM_COLORS[team]:isTaken?"#f9fafb":"#fff",
                    color: isMine?"#fff":isTaken?"#d1d5db":"#37352f",
                    cursor:isTaken?"not-allowed":"pointer",
                    fontWeight:700,fontSize:14,fontFamily:"inherit"}}>
                  {r}위
                </button>
              );
            })}
          </div>
        </div>
      );
    })}

    {/* 조 결과 요약 */}
    {Object.keys(gResult).length===5&&(
      <div className="card" style={{background:"#f0fdf4",borderColor:"#bbf7d0"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#15803d",marginBottom:8}}>
          ✅ {grp.name} 완료
        </div>
        {Object.entries(gResult).sort((a,b)=>a[1]-b[1]).map(([cls,rank])=>{
          const team=classToTeam(cls);
          return(<div key={cls} className="rrow">
            <span style={{minWidth:28,fontSize:14}}>{rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":`${rank}위`}</span>
            <TeamBadge team={team} size={26}/>
            <span style={{flex:1,fontWeight:600}}>{cls}반</span>
            <Chip color={TEAM_COLORS[team]} bg={TEAM_BG[team]}>{GRP_PTS[rank-1]}pt</Chip>
          </div>);
        })}
      </div>
    )}
  </>);
}

function ORelay({ state, update }) {
  const gs = state.groupScores?.["계주"]||{};
  const rf = state.relayFinals||{};
  const [tab, setTab] = useState("prelim");
  const [selGk, setSelGk] = useState("g1");

  const setRank = (gk, cls, rank) => update(s => {
    const cur = s.groupScores?.["계주"]?.[gk]?.[cls];
    const newG = { ...(s.groupScores?.["계주"]?.[gk]||{}) };
    if(cur===rank) delete newG[cls];
    else {
      for(const [c,r] of Object.entries(newG)) { if(r===rank) delete newG[c]; }
      newG[cls] = rank;
    }
    return { ...s, groupScores:{ ...(s.groupScores||{}),
      "계주":{ ...(s.groupScores?.["계주"]||{}), [gk]:newG } } };
  });

  const setFinalRank = (gradeKey, cls, rank) => update(s => {
    const cur = s.relayFinals?.[gradeKey]?.[cls];
    const newF = { ...(s.relayFinals?.[gradeKey]||{}) };
    if(cur===rank) delete newF[cls];
    else {
      for(const [c,r] of Object.entries(newF)) { if(r===rank) delete newF[c]; }
      newF[cls] = rank;
    }
    return { ...s, relayFinals:{ ...(s.relayFinals||{}), [gradeKey]:newF } };
  });

  // 결승 진출자: 각 조 상위 2팀
  const getFinalists = (gradeGroups) =>
    gradeGroups.flatMap(gk => {
      const gr = gs[gk]||{};
      return Object.entries(gr).filter(([,r])=>r<=2).sort((a,b)=>a[1]-b[1]).map(([cls])=>cls);
    });

  const grade1Finalists = getFinalists(["g1","g2"]);
  const grade2Finalists = getFinalists(["g3","g4"]);

  const grp = GRP_DEF[selGk];
  const gResult = gs[selGk]||{};
  const takenRanks = Object.values(gResult);

  return(<>
    <div className="page-title">🏃 계주</div>
    <div className="page-desc">예선 4조 → 각 조 1·2위 결승 진출 → 학년별 결승</div>

    <div style={{display:"flex",gap:8,marginBottom:12}}>
      <button onClick={()=>setTab("prelim")} className={`obtn${tab==="prelim"?" on":""}`} style={{flex:1}}>
        📋 예선 결과 입력
      </button>
      <button onClick={()=>setTab("final")} className={`obtn${tab==="final"?" on":""}`} style={{flex:1}}>
        🏆 결승 결과 입력
      </button>
    </div>

    {tab==="prelim"&&(<>
      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,
        padding:"10px 14px",marginBottom:12,fontSize:13,color:"#1d4ed8"}}>
        각 조 1·2위 → 결승 진출 | 3·4·5위 → 예선 탈락 ({RELAY_ELIM_PTS}pt 동일)
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
        {GRP_KEYS.map(gk=>{
          const done = Object.keys(gs[gk]||{}).length;
          const g = GRP_DEF[gk];
          return(
            <button key={gk} onClick={()=>setSelGk(gk)}
              className={`obtn${selGk===gk?" on":""}`}
              style={{padding:"9px 8px",fontSize:13,display:"flex",
                flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontWeight:800}}>{g.name}</span>
              <span style={{fontSize:10,opacity:.8}}>{done}/5 입력</span>
            </button>
          );
        })}
      </div>
      {grp.cls.map(cls=>{
        const team=classToTeam(cls);
        const curRank=gResult[cls];
        const isAdv=curRank&&curRank<=2;
        return(
          <div key={cls} className="card" style={{marginBottom:6,padding:"10px 12px",
            background:isAdv?"#f0fdf4":"#fff",borderColor:isAdv?"#bbf7d0":"#e7e7e5"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <TeamBadge team={team} size={24}/>
              <span style={{fontWeight:700,flex:1}}>{cls}반 ({team}팀)</span>
              {curRank&&<span style={{fontSize:13,fontWeight:800,
                color:isAdv?"#16a34a":"#9b9a97"}}>
                {isAdv?"🏅 결승 진출":"예선 탈락"} ({curRank}위)
              </span>}
            </div>
            <div style={{display:"flex",gap:5}}>
              {[1,2,3,4,5].map(r=>{
                const isMine=curRank===r;
                const isTaken=takenRanks.includes(r)&&!isMine;
                return(
                  <button key={r} onClick={()=>!isTaken&&setRank(selGk,cls,r)}
                    style={{flex:1,padding:"9px 0",borderRadius:6,border:"1.5px solid",
                      borderColor:isMine?TEAM_COLORS[team]:isTaken?"#f3f4f6":"#e7e7e5",
                      background:isMine?TEAM_COLORS[team]:isTaken?"#f9fafb":"#fff",
                      color:isMine?"#fff":isTaken?"#d1d5db":"#37352f",
                      cursor:isTaken?"not-allowed":"pointer",
                      fontWeight:700,fontSize:14,fontFamily:"inherit"}}>
                    {r}위
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </>)}

    {tab==="final"&&(
      [
        {key:"grade1", label:"1학년 결승", finalists:grade1Finalists},
        {key:"grade2", label:"2학년 결승", finalists:grade2Finalists},
      ].map(({key,label,finalists})=>(
        <div key={key} style={{marginBottom:20}}>
          <div className="sl">{label}</div>
          {finalists.length<4?(
            <div className="card" style={{color:"#9b9a97",textAlign:"center",padding:30}}>
              {label.replace("결승","예선")}을 먼저 완료하세요<br/>
              <span style={{fontSize:12}}>(각 조 1·2위 총 4팀 필요 · 현재 {finalists.length}팀)</span>
            </div>
          ):(
            <div>
              {finalists.map(cls=>{
                const team=classToTeam(cls);
                const curRank=rf[key]?.[cls];
                const takenF=Object.values(rf[key]||{});
                return(
                  <div key={cls} className="card" style={{marginBottom:6,padding:"10px 12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <TeamBadge team={team} size={24}/>
                      <span style={{fontWeight:700,flex:1}}>{cls}반 ({team}팀)</span>
                      {curRank&&<Chip color={TEAM_COLORS[team]} bg={TEAM_BG[team]}>
                        {curRank}위 +{RELAY_FINAL_PTS[curRank-1]}pt
                      </Chip>}
                    </div>
                    <div style={{display:"flex",gap:5}}>
                      {[1,2,3,4].map(r=>{
                        const isMine=curRank===r;
                        const isTaken=takenF.includes(r)&&!isMine;
                        return(
                          <button key={r} onClick={()=>!isTaken&&setFinalRank(key,cls,r)}
                            style={{flex:1,padding:"9px 0",borderRadius:6,border:"1.5px solid",
                              borderColor:isMine?TEAM_COLORS[team]:isTaken?"#f3f4f6":"#e7e7e5",
                              background:isMine?TEAM_COLORS[team]:isTaken?"#f9fafb":"#fff",
                              color:isMine?"#fff":isTaken?"#d1d5db":"#37352f",
                              cursor:isTaken?"not-allowed":"pointer",
                              fontWeight:700,fontSize:14,fontFamily:"inherit"}}>
                            {r}위
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      ))
    )}
  </>);
}



// ════════════════════════════════════════════════════════
//  ORoster: 운영자 - 참가 신청 명단 (구글시트 연동)
// ════════════════════════════════════════════════════════
function ORoster({state, update}) {
  const roster = state.roster || {sheetUrl:"", classes:{}};
  const [sheetUrl, setSheetUrl] = useState(roster.sheetUrl||"");
  const [loading, setLoading] = useState(false);
  const [selClass, setSelClass] = useState(null);

  const SPORT_COLS = ["줄다리기","장애물달리기","계주","태풍의눈","8자마라톤","피지컬100","미션달리기","골때녀"];

  // 시트 형식:
  // 행 1: 헤더
  // A=학급(1-1), B=담임, C=반장, D=부반장, E=체육부장, F=팀 소개 멘트
  // G~ 이후: 학생 명단 (학번|이름|성별|종목1,종목2,...)
  // 
  // 또는 다른 구조: 한 시트에 학급별 섹션 구분
  // 여기서는 단순화: 시트 1행=학급, 그 다음행~12명 학생 묶음
  // 더 깔끔한 방식: 학급 정보 시트 + 학생 시트 분리
  
  // 실제 구현: 단일 시트 / 한 학생당 한 행
  // A=학급(1-1), B=학번, C=이름, D=성별(남/여), 
  // E=담임여부(✓), F=반장여부(✓), G=부반장(✓), H=체육부장(✓),
  // I=팀소개멘트(첫 행만), J~Q=종목 8개 (체크된 종목)

  const loadFromSheet = async () => {
    const csvUrl = sheetToCSV(sheetUrl);
    if(!csvUrl) { alert("구글 시트 공유 URL이 올바르지 않습니다"); return; }
    setLoading(true);
    try {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);
      const classes = {};

      // 첫 행 헤더 건너뛰기
      for(let i=1; i<rows.length; i++) {
        const r = rows[i];
        const cls = (r[0]||"").trim();
        if(!cls) continue;
        if(!classes[cls]) {
          classes[cls] = {
            teacher:"", leader:"", vleader:"", sportLead:"",
            intro:"", students:[]
          };
        }
        const c = classes[cls];
        const stuId   = (r[1]||"").trim();
        const stuName = (r[2]||"").trim();
        const gender  = (r[3]||"").trim();
        const isHomeroom = !!(r[4]||"").trim();
        const isLeader   = !!(r[5]||"").trim();
        const isVleader  = !!(r[6]||"").trim();
        const isSportLead= !!(r[7]||"").trim();
        const introText  = (r[8]||"").trim();

        // 종목들 (J~Q열, 인덱스 9~16)
        const sports = [];
        for(let s=0; s<SPORT_COLS.length; s++) {
          const v = (r[9+s]||"").trim();
          if(v && v!=="0" && v.toLowerCase()!=="false") sports.push(SPORT_COLS[s]);
        }

        if(introText && !c.intro) c.intro = introText;
        if(isHomeroom && stuName) c.teacher = stuName;
        if(isLeader   && stuName) c.leader = stuName;
        if(isVleader  && stuName) c.vleader = stuName;
        if(isSportLead&& stuName) c.sportLead = stuName;
        if(stuName && (gender==="남"||gender==="여")) {
          c.students.push({id:stuId, name:stuName, gender, sports});
        }
      }

      update(s => ({
        ...s, roster:{ sheetUrl, classes }
      }));
      alert(`✅ ${Object.keys(classes).length}개 학급, 명단 불러왔습니다`);
    } catch(e) {
      alert("불러오기 실패: "+e.message+"\n시트 공유를 '링크가 있는 모든 사용자: 뷰어'로 설정해주세요");
    }
    setLoading(false);
  };

  // 학급 명단 통계
  const getClassStats = (cls) => {
    const c = roster.classes?.[cls];
    if(!c) return null;
    const stats = {total:c.students.length, m:0, f:0, bySport:{}};
    for(const st of c.students) {
      if(st.gender==="남") stats.m++;
      else if(st.gender==="여") stats.f++;
      for(const sp of st.sports) {
        if(!stats.bySport[sp]) stats.bySport[sp]={total:0,m:0,f:0,names:[]};
        stats.bySport[sp].total++;
        stats.bySport[sp].names.push(st.name);
        if(st.gender==="남") stats.bySport[sp].m++;
        else if(st.gender==="여") stats.bySport[sp].f++;
      }
    }
    return stats;
  };

  const classes = roster.classes||{};
  const classKeys = Object.keys(classes).sort();

  const TEMPLATE_URL = "https://docs.google.com/spreadsheets/d/1XXX/copy"; // 안내용

  return(<>
    <div className="page-title">📋 참가 신청 명단</div>
    <div className="page-desc">
      각 학급 담임/체육부장이 구글시트에 입력 → 자동 집계
    </div>

    {/* 시트 양식 안내 */}
    <div className="card" style={{marginBottom:12,background:"#eff6ff",borderColor:"#bfdbfe"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1d4ed8",marginBottom:6}}>📊 시트 양식</div>
      <div style={{fontSize:12,color:"#1e40af",lineHeight:1.7}}>
        <b>1행은 헤더 (제목)</b>, 2행부터 학생별 입력<br/>
        A=학급(예: 1-1) · B=학번 · C=이름 · D=성별(남/여)<br/>
        E=담임(✓) · F=반장(✓) · G=부반장(✓) · H=체육부장(✓)<br/>
        I=팀소개멘트(학급당 1행만 입력) · J~Q=종목 체크<br/>
        <br/>
        <b>종목 컬럼 순서:</b><br/>
        J=줄다리기 · K=장애물달리기 · L=계주 · M=태풍의눈<br/>
        N=8자마라톤 · O=피지컬100 · P=미션달리기 · Q=골때녀
      </div>
    </div>

    {/* 시트 URL 입력 */}
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontSize:13,fontWeight:700,color:"#37352f",marginBottom:8}}>
        🔗 구글 시트 공유 URL
      </div>
      <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
        placeholder="https://docs.google.com/spreadsheets/d/..."
        className="oinput" style={{marginBottom:8,fontFamily:"monospace",fontSize:12}}/>
      <div style={{fontSize:11,color:"#9b9a97",marginBottom:8,lineHeight:1.5}}>
        ⚠️ 시트 공유 설정: "링크가 있는 모든 사용자 → 뷰어"
      </div>
      <button onClick={loadFromSheet} disabled={loading}
        className="obtn primary" style={{width:"100%",padding:10,fontSize:14}}>
        {loading?"불러오는 중...":"📥 시트에서 명단 불러오기"}
      </button>
    </div>

    {/* 학급 목록 + 통계 */}
    {classKeys.length>0 ? (<>
      <div className="sl">📊 학급별 신청 현황 ({classKeys.length}개)</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
        {classKeys.map(cls=>{
          const stats = getClassStats(cls);
          const team = classToTeam(cls);
          return(
            <div key={cls} onClick={()=>setSelClass(selClass===cls?null:cls)}
              className="card" style={{
                cursor:"pointer",padding:"10px 12px",
                borderLeft:`4px solid ${TEAM_COLORS[team]}`,
                background:selClass===cls?TEAM_BG[team]:"#fff"
              }}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                <span style={{fontWeight:800,color:TEAM_COLORS[team]}}>{cls}반</span>
                <span style={{fontSize:11,color:"#9b9a97"}}>({team}팀)</span>
              </div>
              <div style={{fontSize:12,color:"#37352f"}}>
                👥 {stats.total}명 · 👦 {stats.m} · 👧 {stats.f}
              </div>
            </div>
          );
        })}
      </div>

      {/* 선택된 학급 상세 */}
      {selClass && (() => {
        const c = roster.classes[selClass];
        const stats = getClassStats(selClass);
        const team = classToTeam(selClass);
        return(
          <div className="card" style={{borderColor:TEAM_COLORS[team],borderWidth:2}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,
              paddingBottom:10,borderBottom:`1px solid ${TEAM_BG[team]}`}}>
              <TeamBadge team={team} size={30}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:900,fontSize:18,color:"#37352f"}}>{selClass}반</div>
                <div style={{fontSize:12,color:"#787671"}}>{team}팀 · 총 {stats.total}명</div>
              </div>
            </div>

            {/* 학급 정보 */}
            <div style={{fontSize:13,color:"#37352f",lineHeight:1.8,marginBottom:14,
              background:"#fafaf9",padding:"10px 12px",borderRadius:6}}>
              {c.teacher  && <div>📝 담임: <b>{c.teacher} 선생님</b></div>}
              {c.leader   && <div>👨‍🎓 반장: <b>{c.leader}</b></div>}
              {c.vleader  && <div>👩‍🎓 부반장: <b>{c.vleader}</b></div>}
              {c.sportLead&& <div>🏅 체육부장: <b>{c.sportLead}</b></div>}
            </div>

            {/* 팀 소개 멘트 */}
            {c.intro && (
              <div style={{background:"#fff7ed",border:"1px solid #fed7aa",
                borderRadius:8,padding:"10px 12px",marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:"#92400e",marginBottom:4}}>
                  📣 팀 소개 멘트 (입장식)
                </div>
                <div style={{fontSize:13,color:"#78350f",lineHeight:1.6}}>{c.intro}</div>
              </div>
            )}

            {/* 종목별 참가자 */}
            <div className="sl">🏆 종목별 참가자</div>
            {SPORT_COLS.map(sp=>{
              const spStats = stats.bySport[sp];
              if(!spStats) return null;
              return(
                <div key={sp} className="card" style={{marginBottom:6,padding:"8px 12px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontWeight:700,color:"#37352f",flex:1,fontSize:13}}>
                      {sp}
                    </span>
                    <span style={{fontSize:11,color:"#787671"}}>
                      {spStats.total}명 (남 {spStats.m} · 여 {spStats.f})
                    </span>
                  </div>
                  <div style={{fontSize:12,color:"#787671",lineHeight:1.5}}>
                    {spStats.names.join(", ")}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}
    </>) : (
      <div className="card" style={{textAlign:"center",color:"#9b9a97",padding:30}}>
        시트에서 명단을 불러오면 학급별 현황이 표시됩니다
      </div>
    )}
  </>);
}

// ════════════════════════════════════════════════════════
//  VRoster: 학생 - 선수 명단 조회
// ════════════════════════════════════════════════════════
function VRoster({state}) {
  const roster = state.roster || {classes:{}};
  const [view, setView] = useState("class"); // class | sport
  const [selClass, setSelClass] = useState(null);
  const [selSport, setSelSport] = useState(null);

  const classes = roster.classes||{};
  const classKeys = Object.keys(classes).sort();

  const SPORT_COLS = ["줄다리기","장애물달리기","계주","태풍의눈","8자마라톤","피지컬100","미션달리기","골때녀"];

  // 종목별 참가자 집계
  const sportRoster = {};
  for(const sp of SPORT_COLS) sportRoster[sp] = {};
  for(const [cls, c] of Object.entries(classes)) {
    for(const st of c.students||[]) {
      for(const sp of st.sports||[]) {
        if(!sportRoster[sp][cls]) sportRoster[sp][cls] = [];
        sportRoster[sp][cls].push({...st});
      }
    }
  }

  if(classKeys.length===0) return(
    <div className="card" style={{textAlign:"center",color:"#9b9a97",padding:50}}>
      📋 선수 명단 준비 중<br/>
      <span style={{fontSize:12,marginTop:6,display:"block"}}>곧 공개됩니다</span>
    </div>
  );

  return(<>
    <div className="page-title">📋 선수 명단</div>

    {/* 보기 모드 */}
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      <button onClick={()=>{setView("class");setSelSport(null);}}
        className={`obtn${view==="class"?" on":""}`} style={{flex:1,padding:"8px 0"}}>
        🏫 학급별
      </button>
      <button onClick={()=>{setView("sport");setSelClass(null);}}
        className={`obtn${view==="sport"?" on":""}`} style={{flex:1,padding:"8px 0"}}>
        🏆 종목별
      </button>
    </div>

    {view==="class" ? (
      // ── 학급별 ──
      <>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
          {classKeys.map(cls=>{
            const team = classToTeam(cls);
            const c = classes[cls];
            return(
              <button key={cls} onClick={()=>setSelClass(selClass===cls?null:cls)}
                style={{
                  padding:"10px 8px",borderRadius:8,
                  border:`2px solid ${selClass===cls?TEAM_COLORS[team]:"#e7e7e5"}`,
                  background:selClass===cls?TEAM_BG[team]:"#fff",
                  cursor:"pointer",fontFamily:"inherit",textAlign:"center"
                }}>
                <div style={{fontWeight:800,fontSize:14,color:TEAM_COLORS[team]}}>{cls}반</div>
                <div style={{fontSize:11,color:"#9b9a97",marginTop:2}}>
                  {team}팀 · {c.students?.length||0}명
                </div>
              </button>
            );
          })}
        </div>

        {selClass && (() => {
          const c = classes[selClass];
          const team = classToTeam(selClass);
          return(
            <div className="card" style={{borderColor:TEAM_COLORS[team],borderWidth:2}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,
                paddingBottom:10,borderBottom:`1px solid ${TEAM_BG[team]}`}}>

function ORoleSetup({state, update}) {
  const roles = state.roles || {};

  const [score,   setScore]   = useState(roles.score  ||"");
  const [mc,      setMc]      = useState(roles.mc     ||"");

  const save = () => {
    update(s=>({...s, roles:{bracket:bracket.trim(), score:score.trim(), mc:mc.trim()}}));

        📋 <b>대진표 담당</b> — 대진표 추첨·결과 입력만<br/>
        ✏️ <b>채점·점수 입력</b> — 점수/피지컬100/8자마라톤/응원전 채점<br/>
        🎙 <b>MC/입장식</b> — 입장식·응원전 진행·공지·BGM
      </div>
    </div>
    {[
      {label:"📋 대진표 담당 비밀번호", val:bracket, set:setBracket, ph:"예: bracket2026"},
      {label:"✏️ 채점·점수 입력 비밀번호", val:score, set:setScore, ph:"예: score2026"},

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:14}}>
              {[
                {id:"operator",icon:"👑",l:"총괄 운영자",desc:"모든 기능"},
                {id:"bracket", icon:"📋",l:"대진표 담당", desc:"대진표·추첨"},
                {id:"score",   icon:"✏️", l:"채점·점수입력",desc:"점수·응원채점"},
                {id:"mc",      icon:"🎤",l:"MC·입장식",  desc:"입장·응원진행"},
              ].map(r=>(
                <div key={r.id} style={{padding:"10px 8px",borderRadius:8,
                  border:"1.5px solid #e7e7e5",background:"#fafaf9",textAlign:"left"}}>
                  <div style={{fontSize:18,marginBottom:3}}>{r.icon}</div>
                  <div style={{fontSize:12,fontWeight:700,color:"#37352f"}}>{r.l}</div>
                  <div style={{fontSize:10,color:"#9b9a97"}}>{r.desc}</div>
                </div>
              ))}
            </div>
            <input type="password" value={pw}
              onChange={e=>{setPw(e.target.value);setPwErr(false);}}
              onKeyDown={e=>e.key==="Enter"&&tryLogin()}
              placeholder="비밀번호 입력 후 로그인" className="oinput"
              style={{marginBottom:8,fontSize:15,borderColor:pwErr?"#eb5757":"#e7e7e5"}}
              autoFocus/>
            {pwErr&&<div style={{color:"#eb5757",fontSize:12,marginBottom:8}}>
              ⚠️ 비밀번호가 틀렸습니다
            </div>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowPwModal(false);setPw("");setPwErr(false);}}
                className="obtn" style={{flex:1,padding:"11px 0"}}>취소</button>
              <button onClick={tryLogin}
                className="obtn primary" style={{flex:1,padding:"11px 0",fontSize:14}}>
                🚀 로그인
              </button>
            </div>
            <div style={{fontSize:11,color:"#bcbbb6",textAlign:"center",marginTop:10,lineHeight:1.5}}>
              총괄 운영자: 1234 · 채점·MC 비번은 운영자가 🔑 에서 설정
            </div>
          </div>
        </div>
      )}
      {/* 도움말 모달 */}
      {showHelp && <HelpModal onClose={()=>setShowHelp(false)}/>}
      {!online && (
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fef2f2",
          borderTop:"2px solid #fecaca",padding:"8px 16px",textAlign:"center",
          fontSize:13,fontWeight:700,color:"#dc2626",zIndex:200}}>
          🔴 오프라인 — 인터넷 연결을 확인하세요
        </div>
      )}
      {online===true && ready && (
        <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#f0fdf4",
          borderTop:"1px solid #bbf7d0",padding:"5px 16px",textAlign:"center",
          fontSize:11,color:"#16a34a",zIndex:200}}>
          {isOp ? "🟢 Firebase 실시간 연결됨 (운영자)" : "🟢 연결됨 · 15초마다 자동 갱신 (우상단 🔄 갱신 탭 터치 시 즉시 갱신)"}
        </div>
      )}
      {isOp
        ? <OperatorPage state={state} update={update} role={role} onLogout={()=>{setIsOp(false);setRole("operator");}}/>
        : <ViewerPage   state={state} onOpClick={()=>setShowPwModal(true)} onRefresh={refresh} refreshing={refreshing}/>
      }
    </div>
  );
}


</script>
</body>
</html>
