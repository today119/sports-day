function sheetToCSV(url) {
  if(!url) return null;
  // https://docs.google.com/spreadsheets/d/{ID}/edit?gid={GID}
  const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(!m) return null;
  const id = m[1];
  const gidMatch = url.match(/[?#&]gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : "0";
  return `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
}

// 구글 드라이브 공유 URL → 직접 재생 URL
function driveToDirect(url) {
  if(!url) return url;
  // https://drive.google.com/file/d/{ID}/view?usp=sharing
  const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url;
}

// CSV 파싱 (간단한 한 줄 행 단위)
function parseCSV(text) {
  const rows = [];
  let cur = [], cell = "", inQuote = false;
  for(let i=0; i<text.length; i++) {
    const c = text[i], n = text[i+1];
    if(inQuote) {
      if(c === '"' && n === '"') { cell+='"'; i++; }
      else if(c === '"') { inQuote = false; }
      else cell += c;
    } else {
      if(c === '"') inQuote = true;
      else if(c === ',') { cur.push(cell); cell=""; }
      else if(c === '\n') { cur.push(cell); rows.push(cur); cur=[]; cell=""; }
      else if(c === '\r') { /* skip */ }
      else cell += c;
    }
  }
  if(cell || cur.length) { cur.push(cell); rows.push(cur); }
  return rows.filter(r => r.some(c => c && c.trim()));
}

// ════════════════════════════════════════════════════════
//  운영자: 입장식 진행
// ════════════════════════════════════════════════════════
function OEntry({ state, update }) {
  const entry = state.entry || { sheetUrl:"", items:{}, current:null };
  const [sheetUrl, setSheetUrl] = useState(entry.sheetUrl || "");
  const [loading, setLoading] = useState(false);
  const [editClass, setEditClass] = useState(null);
  const [editIntro, setEditIntro] = useState("");
  const [editAudio, setEditAudio] = useState("");
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  const upd = patch => update(s => ({ ...s, entry: { ...(s.entry||{}), ...patch } }));

  const loadFromSheet = async () => {
    const csvUrl = sheetToCSV(sheetUrl);
    if(!csvUrl) { alert("구글 시트 공유 URL이 올바르지 않습니다"); return; }
    setLoading(true);
    try {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);
      // 첫 행은 헤더 가정 — 학급/소개/음원
      const items = {};
      let added = 0;
      for(let i=1; i<rows.length; i++) {
        const [cls, intro, audio] = rows[i];
        if(cls && cls.trim()) {
          items[cls.trim()] = {
            intro: (intro||"").trim(),
            audio: driveToDirect((audio||"").trim())
          };
          added++;
        }
      }
      upd({ sheetUrl, items });
      alert(`✅ ${added}개 학급 정보 불러왔습니다`);
    } catch(e) {
      alert("불러오기 실패: " + e.message + "\n시트 공유 설정을 '링크가 있는 모든 사용자'로 해주세요");
    }
    setLoading(false);
  };

  const playClass = (cls) => {
    const data = entry.items?.[cls];
    if(!data) return;
    if(!audioRef.current) audioRef.current = new Audio();
    if(entry.current === cls && playing) {
      audioRef.current.pause();
      setPlaying(false);
    } else {
      upd({ current: cls });
      if(data.audio) {
        audioRef.current.src = data.audio;
        audioRef.current.play().then(()=>setPlaying(true)).catch(e=>{
          alert("재생 실패: " + e.message + "\n음원 URL을 확인해주세요");
        });
      }
    }
  };

  const stopAll = () => {
    if(audioRef.current) audioRef.current.pause();
    setPlaying(false);
    upd({ current: null });
  };

  const startEdit = (cls) => {
    const d = entry.items?.[cls] || {};
    setEditClass(cls);
    setEditIntro(d.intro || `${cls}반 입장!`);
    setEditAudio(d.audio || "");
  };

  const saveEdit = () => {
    const items = { ...(entry.items||{}) };
    items[editClass] = {
      intro: editIntro.trim(),
      audio: driveToDirect(editAudio.trim())
    };
    upd({ items });
    setEditClass(null);
  };

  return (
    <>
      <div className="page-title">🚶 입장식 진행</div>
      <div className="page-desc">학급별 소개 멘트와 입장 음원을 재생합니다</div>

      {/* 구글 시트 연동 */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:700,marginBottom:6,color:"#37352f"}}>📊 구글 스프레드시트 연동</div>
        <div style={{fontSize:12,color:"#787671",marginBottom:10,lineHeight:1.6}}>
          시트 형식: <b>A열=학급(예: 1-1)</b> · <b>B열=소개 멘트</b> · <b>C열=음원 URL</b><br/>
          시트 공유 설정: "링크가 있는 모든 사용자 → 뷰어"
        </div>
        <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
          placeholder="https://docs.google.com/spreadsheets/d/..."
          className="oinput" style={{marginBottom:8,fontFamily:"monospace",fontSize:12}}/>
        <button onClick={loadFromSheet} disabled={loading}
          className="obtn primary" style={{width:"100%",padding:10,fontSize:14}}>
          {loading ? "불러오는 중..." : "📥 시트에서 데이터 가져오기"}
        </button>
      </div>

      {/* 현재 재생 중 */}
      {entry.current && (
        <div className="card hl" style={{marginBottom:14,background:"#fff7ed",borderColor:"#f59e0b"}}>
          <div style={{fontSize:11,color:"#92400e",fontWeight:700,marginBottom:4,letterSpacing:1}}>
            🔊 NOW PLAYING
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <TeamBadge team={classToTeam(entry.current)} size={36}/>
            <div style={{flex:1}}>
              <div style={{fontSize:18,fontWeight:900,color:"#92400e"}}>{entry.current}반</div>
              <div style={{fontSize:13,color:"#a16207",overflow:"hidden",
                textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {entry.items?.[entry.current]?.intro || ""}
              </div>
            </div>
            <button onClick={stopAll} className="obtn danger" style={{fontSize:13}}>⏹ 정지</button>
          </div>
        </div>
      )}

      {/* 학급별 카드 */}
      {["1","2"].map(grade => (
        <div key={grade}>
          <div className="sl">{grade}학년</div>
          {ALL_CLASSES.filter(c=>c.startsWith(grade+"-")).map(cls => {
            const data = entry.items?.[cls];
            const team = classToTeam(cls);
            const isCurrent = entry.current === cls;
            const isEditing = editClass === cls;
            const hasData = data && (data.intro || data.audio);

            if(isEditing) {
              return (
                <div key={cls} className="card hl" style={{marginBottom:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <TeamBadge team={team} size={22}/>
                    <span style={{fontWeight:800}}>{cls}반</span>
                  </div>
                  <input value={editIntro} onChange={e=>setEditIntro(e.target.value)}
                    placeholder="소개 멘트 (예: 1학년 1반, 멋진 출발!)"
                    className="oinput" style={{marginBottom:6}}/>
                  <input value={editAudio} onChange={e=>setEditAudio(e.target.value)}
                    placeholder="음원 URL (mp3 또는 구글 드라이브 공유링크)"
                    className="oinput" style={{marginBottom:8,fontFamily:"monospace",fontSize:12}}/>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={saveEdit} className="obtn primary" style={{flex:1}}>💾 저장</button>
                    <button onClick={()=>setEditClass(null)} className="obtn" style={{flex:1}}>취소</button>
                  </div>
                </div>
              );
            }

            return (
              <div key={cls} className="card" style={{
                marginBottom:6,padding:"10px 14px",
                borderColor: isCurrent ? "#f59e0b" : (hasData ? "#e7e7e5" : "#ebebea"),
                background: isCurrent ? "#fff7ed" : "#fff"
              }}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <TeamBadge team={team} size={24}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,color:"#37352f"}}>{cls}반</div>
                    <div style={{fontSize:12,color: hasData?"#787671":"#bcbbb6",
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {data?.intro || "데이터 없음"}
                    </div>
                  </div>
                  <button onClick={()=>startEdit(cls)} className="obtn" style={{fontSize:12,padding:"5px 9px"}}>
                    ✏️
                  </button>
                  <button onClick={()=>playClass(cls)} disabled={!hasData}
                    style={{
                      width:42,height:42,borderRadius:"50%",border:"none",
                      cursor: hasData?"pointer":"not-allowed",
                      opacity: hasData?1:.3,
                      background: isCurrent && playing ? "#eb5757" : "#37352f",
                      color:"#fff",fontSize:16,fontFamily:"inherit",flexShrink:0
                    }}>
                    {isCurrent && playing ? "⏸" : "▶"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </>
  );
}

// ════════════════════════════════════════════════════════
//  운영자: 응원전 진행
// ════════════════════════════════════════════════════════
function OCheerShow({ state, update }) {
  const cs = state.cheerShow || { sheetUrl:"", items:{}, order:[], currentIdx:-1 };
  const [sheetUrl, setSheetUrl] = useState(cs.sheetUrl || "");
  const [loading, setLoading] = useState(false);
  const [editClass, setEditClass] = useState(null);
  const [editIntro, setEditIntro] = useState("");
  const [editAudio, setEditAudio] = useState("");
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);

  const upd = patch => update(s => ({ ...s, cheerShow: { ...(s.cheerShow||{}), ...patch } }));

  const loadFromSheet = async () => {
    const csvUrl = sheetToCSV(sheetUrl);
    if(!csvUrl) { alert("구글 시트 공유 URL이 올바르지 않습니다"); return; }
    setLoading(true);
    try {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);
      const items = {};
      const order = [];
      for(let i=1; i<rows.length; i++) {
        const [cls, intro, audio] = rows[i];
        if(cls && cls.trim()) {
          const c = cls.trim();
          items[c] = {
            intro: (intro||"").trim(),
            audio: driveToDirect((audio||"").trim())
          };
          order.push(c);
        }
      }
      upd({ sheetUrl, items, order, currentIdx: -1 });
      alert(`✅ ${order.length}개 학급 응원전 정보 불러왔습니다`);
    } catch(e) {
      alert("불러오기 실패: " + e.message);
    }
    setLoading(false);
  };

  const playIdx = (idx) => {
    if(idx < 0 || idx >= cs.order.length) return;
    const cls = cs.order[idx];
    const data = cs.items?.[cls];
    if(!data) return;
    if(!audioRef.current) audioRef.current = new Audio();
    if(cs.currentIdx === idx && playing) {
      audioRef.current.pause();
      setPlaying(false);
    } else {
      upd({ currentIdx: idx });
      if(data.audio) {
        audioRef.current.src = data.audio;
        audioRef.current.play().then(()=>setPlaying(true)).catch(e=>{
          alert("재생 실패: " + e.message);
        });
      }
    }
  };

  const stopAll = () => {
    if(audioRef.current) audioRef.current.pause();
    setPlaying(false);
  };

  const nextClass = () => playIdx(cs.currentIdx + 1);
  const prevClass = () => playIdx(cs.currentIdx - 1);

  const startEdit = (cls) => {
    const d = cs.items?.[cls] || {};
    setEditClass(cls);
    setEditIntro(d.intro || `${cls}반 응원전을 시작하겠습니다`);
    setEditAudio(d.audio || "");
  };

  const saveEdit = () => {
    const items = { ...(cs.items||{}) };
    items[editClass] = {
      intro: editIntro.trim(),
      audio: driveToDirect(editAudio.trim())
    };
    // 순서에 없으면 추가
    let order = [...(cs.order||[])];
    if(!order.includes(editClass)) order.push(editClass);
    upd({ items, order });
    setEditClass(null);
  };

  const moveOrder = (idx, dir) => {
    const arr = [...cs.order];
    const ni = idx + dir;
    if(ni<0 || ni>=arr.length) return;
    [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
    let newCur = cs.currentIdx;
    if(cs.currentIdx === idx) newCur = ni;
    else if(cs.currentIdx === ni) newCur = idx;
    upd({ order: arr, currentIdx: newCur });
  };

  const removeFromOrder = (idx) => {
    const arr = cs.order.filter((_,i) => i !== idx);
    let newCur = cs.currentIdx;
    if(idx < cs.currentIdx) newCur--;
    else if(idx === cs.currentIdx) newCur = -1;
    upd({ order: arr, currentIdx: newCur });
  };

  const currentCls = cs.currentIdx >= 0 ? cs.order[cs.currentIdx] : null;
  const nextCls = cs.currentIdx + 1 < (cs.order?.length||0) ? cs.order[cs.currentIdx+1] : null;

  // 응원전 채점 진행 현황 계산
  const cheerResult = computeCheerTotals(state.cheer);
  const judgeProgress = cheerResult?.judgeProgress || CHEER_JUDGES.flatMap(j=>j.names.map(n=>({dept:j.dept,name:n,classCount:0,submitted:false})));
  const notStarted = judgeProgress.filter(j=>j.classCount===0);
  const inProgress = judgeProgress.filter(j=>j.classCount>0 && j.classCount<ALL_CLASSES.length);
  const completed  = judgeProgress.filter(j=>j.classCount>=ALL_CLASSES.length);

  return (
    <>
      <div className="page-title">📣 응원전 진행</div>
      <div className="page-desc">학급별 응원전 순서대로 진행 · 학생 화면에 현재/다음 표시</div>

      {/* === 응원전 점수 공개 토글 (히든 30점) === */}
      <div className="card" style={{
        marginBottom:14, padding:14,
        background: state.cheerReveal
          ? "linear-gradient(135deg,#dcfce7,#f0fdf4)"
          : "linear-gradient(135deg,#fef2f2,#fff1f2)",
        borderColor: state.cheerReveal ? "#86efac" : "#fca5a5",
        borderWidth:2
      }}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:24}}>{state.cheerReveal?"🎭":"🔒"}</span>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:15,
              color:state.cheerReveal?"#15803d":"#b91c1c"}}>
              응원전(30점) 점수 {state.cheerReveal?"공개됨":"비공개"}
            </div>
            <div style={{fontSize:11,marginTop:3,
              color:state.cheerReveal?"#166534":"#991b1b",lineHeight:1.5}}>
              {state.cheerReveal
                ? "학생 화면에 응원전 점수가 반영되어 최종 순위로 표시됩니다"
                : "응원전 점수는 합계에 미반영 · 다른 카테고리만 임시 순위로 표시됩니다"}
            </div>
          </div>
          <button
            onClick={()=>{
              const next = !state.cheerReveal;
              if(next && !confirm("응원전 점수를 공개하시겠습니까?\n공개 후 학생 화면에 즉시 반영됩니다.")) return;
              if(!next && !confirm("응원전 점수를 다시 비공개로 전환할까요?")) return;
              update(s=>({...s, cheerReveal: next}));
            }}
            className="obtn"
            style={{
              padding:"10px 16px",fontSize:13,fontWeight:800,
              background:state.cheerReveal?"#dc2626":"#16a34a",color:"#fff",border:"none",
              boxShadow:"0 2px 6px rgba(0,0,0,.12)"
            }}>
            {state.cheerReveal ? "🔒 비공개로" : "🎭 공개하기"}
          </button>
        </div>
      </div>

      {/* === 심판 채점 현황 (독촉용) === */}
      <div className="card" style={{marginBottom:14, padding:14,
        background:"linear-gradient(135deg,#fefce8,#fffbeb)",
        borderColor:"#fde68a", borderWidth:2}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:20}}>⭐</span>
          <div style={{fontWeight:800,color:"#854f0b",fontSize:15,flex:1}}>
            응원전 심판 채점 현황
          </div>
          <div style={{fontSize:12,color:"#92400e",fontWeight:700}}>
            {completed.length}/{judgeProgress.length} 완료
          </div>
        </div>

        {/* 진행 바 */}
        <div style={{height:8,background:"#fef3c7",borderRadius:4,overflow:"hidden",
          marginBottom:12,display:"flex"}}>
          <div style={{width:`${completed.length/judgeProgress.length*100}%`,background:"#10b981"}}/>
          <div style={{width:`${inProgress.length/judgeProgress.length*100}%`,background:"#f59e0b"}}/>
        </div>

        {/* 심판 12명 그리드 */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:6}}>
          {judgeProgress.map((j,i)=>{
            const status = j.submitted ? "done" : j.classCount>0 ? "doing" : "todo";
            const bg = status==="done"?"#dcfce7":status==="doing"?"#fef3c7":"#fee2e2";
            const col = status==="done"?"#15803d":status==="doing"?"#a16207":"#b91c1c";
            const icon = status==="done"?"🟢":status==="doing"?"🟡":"🔴";
            return (
              <div key={i} style={{
                background:bg, padding:"7px 10px", borderRadius:6,
                border:`1px solid ${col}33`, fontSize:12
              }}>
                <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
                  <span style={{fontSize:11}}>{icon}</span>
                  <span style={{fontWeight:800,color:col,fontSize:13}}>{j.name}</span>
                </div>
                <div style={{fontSize:10,color:"#6b7280",fontWeight:600,marginLeft:18}}>
                  {j.dept}
                </div>
                <div style={{fontSize:11,color:col,fontWeight:700,marginLeft:18,marginTop:2}}>
                  {status==="done"?`완료 (${j.classCount}/${ALL_CLASSES.length})`:
                   status==="doing"?`진행중 (${j.classCount}/${ALL_CLASSES.length})`:
                   `미시작 (0/${ALL_CLASSES.length})`}
                </div>
              </div>
            );
          })}
        </div>

        {/* 독촉 메시지 복사 */}
        {(notStarted.length>0 || inProgress.length>0) && (
          <div style={{marginTop:10,paddingTop:10,borderTop:"1px dashed #fcd34d"}}>
            <div style={{fontSize:11,color:"#92400e",fontWeight:700,marginBottom:6}}>
              📢 독촉 메시지 (복사해서 전송):
            </div>
            <div style={{background:"#fff",padding:8,borderRadius:6,
              fontSize:12,color:"#1f2937",lineHeight:1.6,marginBottom:6,
              border:"1px dashed #d1d5db",fontFamily:"inherit"}}>
              [응원전 채점 안내]<br/>
              {[...notStarted,...inProgress].map(j=>`${j.dept} ${j.name}`).join(", ")} 선생님,<br/>
              아직 응원전 채점이 완료되지 않았습니다. 학생들이 결과를 기다리고 있어요!<br/>
              👉 학교 응원전 채점 페이지 ⭐채점 메뉴에서 채점 부탁드립니다.
            </div>
            <button className="obtn" style={{width:"100%",fontSize:12,padding:8}}
              onClick={()=>{
                const msg = `[응원전 채점 안내]\n${[...notStarted,...inProgress].map(j=>`${j.dept} ${j.name}`).join(", ")} 선생님, 아직 응원전 채점이 완료되지 않았습니다. ⭐채점 메뉴에서 채점 부탁드립니다.`;
                navigator.clipboard?.writeText(msg).then(
                  ()=>alert("✅ 독촉 메시지를 복사했습니다"),
                  ()=>alert("복사 실패 - 직접 선택해서 복사해주세요")
                );
              }}>
              📋 독촉 메시지 복사
            </button>
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{fontWeight:700,marginBottom:6,color:"#37352f"}}>📊 구글 스프레드시트 연동</div>
        <div style={{fontSize:12,color:"#787671",marginBottom:10,lineHeight:1.6}}>
          시트 형식: A열=학급 · B열=소개 멘트 · C열=음원 URL
        </div>
        <input value={sheetUrl} onChange={e=>setSheetUrl(e.target.value)}
          placeholder="https://docs.google.com/spreadsheets/d/..."
          className="oinput" style={{marginBottom:8,fontFamily:"monospace",fontSize:12}}/>
        <button onClick={loadFromSheet} disabled={loading}
          className="obtn primary" style={{width:"100%",padding:10,fontSize:14}}>
          {loading ? "불러오는 중..." : "📥 시트에서 데이터 가져오기"}
        </button>
      </div>

      {/* 컨트롤 패널 */}
      {currentCls && (
        <div className="card hl" style={{marginBottom:14,background:"#fff7ed",borderColor:"#f59e0b"}}>
          <div style={{fontSize:11,color:"#92400e",fontWeight:700,marginBottom:6,letterSpacing:1}}>
            🔊 진행 중
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <TeamBadge team={classToTeam(currentCls)} size={36}/>
            <div style={{flex:1}}>
              <div style={{fontSize:20,fontWeight:900,color:"#92400e"}}>{currentCls}반</div>
              <div style={{fontSize:13,color:"#a16207"}}>
                {cs.items?.[currentCls]?.intro || ""}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={prevClass} disabled={cs.currentIdx<=0}
              className="obtn" style={{flex:1,padding:8,
              opacity:cs.currentIdx<=0?.3:1}}>⏮ 이전</button>
            <button onClick={()=>playIdx(cs.currentIdx)} className="obtn"
              style={{flex:1,padding:8,background:playing?"#eb5757":"#37352f",color:"#fff",borderColor:"transparent"}}>
              {playing?"⏸ 일시정지":"▶ 재생"}
            </button>
            <button onClick={nextClass} disabled={cs.currentIdx>=(cs.order?.length||0)-1}
              className="obtn" style={{flex:1,padding:8,
              opacity:cs.currentIdx>=(cs.order?.length||0)-1?.3:1}}>다음 ⏭</button>
          </div>
        </div>
      )}

      {nextCls && (
        <div className="card" style={{marginBottom:14,background:"#f9fafb"}}>
          <div style={{fontSize:11,color:"#9b9a97",fontWeight:600,marginBottom:4,letterSpacing:1}}>
            ⏳ 다음 순서
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <TeamBadge team={classToTeam(nextCls)} size={28}/>
            <span style={{fontSize:16,fontWeight:700,color:"#37352f"}}>{nextCls}반</span>
          </div>
        </div>
      )}

      {/* 순서 목록 */}
      <div className="sl">진행 순서 ({cs.order?.length||0}개)</div>
      {(!cs.order || cs.order.length===0) ? (
        <div className="card" style={{textAlign:"center",color:"#9b9a97",padding:40}}>
          시트에서 데이터를 불러오거나 학급별로 추가해주세요
        </div>
      ) : cs.order.map((cls, idx) => {
        const data = cs.items?.[cls];
        const team = classToTeam(cls);
        const isCurrent = cs.currentIdx === idx;
        const isPast = cs.currentIdx > idx;
        return (
          <div key={cls+idx} className="card" style={{
            marginBottom:6,padding:"10px 12px",
            background: isCurrent ? "#fff7ed" : (isPast ? "#fafaf9" : "#fff"),
            borderColor: isCurrent ? "#f59e0b" : "#e7e7e5",
            opacity: isPast ? .6 : 1
          }}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{minWidth:28,textAlign:"center",fontSize:13,fontWeight:700,
                color:isCurrent?"#92400e":"#9b9a97"}}>
                {isPast?"✓":idx+1}
              </span>
              <TeamBadge team={team} size={22}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,color:"#37352f"}}>{cls}반</div>
                <div style={{fontSize:11,color:"#9b9a97",overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {data?.intro || "데이터 없음"}
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:2}}>
                <button onClick={()=>moveOrder(idx,-1)} disabled={idx===0}
                  style={{width:22,height:16,border:"1px solid #e7e7e5",background:"#fff",
                    cursor:idx===0?"not-allowed":"pointer",opacity:idx===0?.3:1,
                    borderRadius:3,fontSize:9,padding:0}}>▲</button>
                <button onClick={()=>moveOrder(idx,1)} disabled={idx===cs.order.length-1}
                  style={{width:22,height:16,border:"1px solid #e7e7e5",background:"#fff",
                    cursor:idx===cs.order.length-1?"not-allowed":"pointer",
                    opacity:idx===cs.order.length-1?.3:1,
                    borderRadius:3,fontSize:9,padding:0}}>▼</button>
              </div>

// ════════════════════════════════════════════════════════
//  피지컬100 컴포넌트
// ════════════════════════════════════════════════════════
function useP100(state, update) {
  const p        = state.p100 || {};
  const roster   = p.roster   || {};
  const r1       = p.r1       || { m:{}, f:{} };
  const r2elim   = p.r2elim   || { m:[], f:[] };
  const r3       = p.r3       || { m:{}, f:{} };
  // 현재 진행중인 위치 (학생 화면에 동기화)
  const current  = p.current  || { gk:"m", runner:1, group:"a" };

  const upd = patch => update(s => ({ ...s, p100:{ ...(s.p100||{}), ...patch } }));

  // 참가신청 명단(state.roster)에서 피지컬100 신청자를 학급·성별별로 자동 추출
  const autoRoster = (() => {
    const out = {};
    const classes = state.roster?.classes || {};
    for(const cls of Object.keys(classes)) {
      const stus = classes[cls]?.students || [];
      const m = stus.filter(s=>s.gender==="남" && (s.sports||[]).includes("피지컬100")).map(s=>s.name);
      const f = stus.filter(s=>s.gender==="여" && (s.sports||[]).includes("피지컬100")).map(s=>s.name);
      out[cls] = { m, f };
    }
    return out;
  })();

  // 이름 조회: 수동 입력 → 자동(참가신청) → 기본값
  const getRunner = (cls, gk, idx=0) => {
    const manual = roster[cls]?.[gk]?.[idx]?.trim();
    if(manual) return manual;
    const auto = autoRoster[cls]?.[gk]?.[idx];
    if(auto) return auto;
    return `${cls}반 ${idx+1}번`;
  };

  const setRoster = (cls, gk, idx, val) => {
    const cur = [...(roster[cls]?.[gk] || ["","","","",""])];
    cur[idx] = val;
    upd({ roster: { ...roster, [cls]:{ ...(roster[cls]||{}), [gk]:cur } } });
  };

  // 참가신청 명단을 수동 roster로 일괄 복사 (편집 가능 상태)
  const importFromRoster = () => {
    if(!confirm("참가신청 명단(구글시트)에서 피지컬100 신청자를 자동으로 채워넣을까요?\n이미 입력한 내용이 덮어쓰여집니다.")) return;
    const next = {};
    for(const cls of Object.keys(autoRoster)) {
      next[cls] = {
        m: [autoRoster[cls].m[0]||"", autoRoster[cls].m[1]||"", autoRoster[cls].m[2]||"", autoRoster[cls].m[3]||"", autoRoster[cls].m[4]||""],
        f: [autoRoster[cls].f[0]||"", autoRoster[cls].f[1]||"", autoRoster[cls].f[2]||"", autoRoster[cls].f[3]||"", autoRoster[cls].f[4]||""],
      };
    }
    upd({ roster: next });
    alert(`✅ ${Object.keys(next).length}개 학급 자동 채움 완료`);
  };

  const setR1Winner = (gk, hk, winner) => {
    upd({ r1:{ ...r1, [gk]:{ ...(r1[gk]||{}), [hk]:winner } } });
  };

  const setCurrent = (patch) => {
    upd({ current: { ...current, ...patch } });
  };

  const toggleElim = (gk, hk) => {
    const cur  = r2elim[gk]||[];
    const next = cur.includes(hk) ? cur.filter(x=>x!==hk) : [...cur, hk];
    upd({ r2elim:{ ...r2elim, [gk]:next } });
  };

  const setR3 = (gk, mk, hk) =>
    upd({ r3:{ ...r3, [gk]:{ ...(r3[gk]||{}), [mk]:hk } } });

  // 1차전 통과자
  const qualifiers = gk => Object.entries(r1[gk]||{})
    .filter(([,w]) => w?.cls)
    .map(([hk,w]) => ({ hk, ...w }));

  // 2라운드 생존자
  const survivors = gk => qualifiers(gk)
    .filter(({hk}) => !(r2elim[gk]||[]).includes(hk));

  return { roster, autoRoster, r1, r2elim, r3, current,
           getRunner, setRoster, importFromRoster, setR1Winner, setCurrent,
           toggleElim, setR3, qualifiers, survivors };
}

// ════════════════════════════════════════════
//  StartSignal: 제자리에 → 차렷 → 탕! 신호
// ════════════════════════════════════════════
function StartSignal() {
  const [phase, setPhase] = useState("idle");
  const [lang, setLang]   = useState("ko"); // "ko" | "en"

  const speak = (text, rate=0.85, pitch=0.9, forceLang) => new Promise(res => {
    if(!window.speechSynthesis) { res(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const l = forceLang || (lang==="ko" ? "ko-KR" : "en-US");
    u.lang = l; u.rate = rate; u.pitch = pitch; u.volume = 1;
    u.onend = res; u.onerror = res;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang===l) || voices.find(v=>v.lang.startsWith(l.split("-")[0]));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  });

  const gunShot = () => {
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(1.8, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
      const filter = ctx.createBiquadFilter();
      filter.type="lowpass"; filter.frequency.value=1800;
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      src.start(); src.stop(ctx.currentTime+0.4);
      const echo = ctx.createGain();
      echo.gain.setValueAtTime(0.4, ctx.currentTime+0.1);
      echo.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
      const src2 = ctx.createBufferSource(); src2.buffer = buf;
      src2.connect(filter); filter.connect(echo); echo.connect(ctx.destination);
      src2.start(ctx.currentTime+0.08); src2.stop(ctx.currentTime+0.65);
    } catch(e) { console.warn("AudioContext error:", e); }
  };

  const SCRIPTS = {
    ko: { ready:"제자리에", set:"차렷",       rate:0.8, pitch:0.85 },
    en: { ready:"On your marks", set:"Get set", rate:0.9, pitch:1.0  },
  };

  const runSequence = async () => {
    if(phase !== "idle" && phase !== "cooldown") return;
    const sc = SCRIPTS[lang];
    setPhase("ready");
    await speak(sc.ready, sc.rate, sc.pitch);
    await new Promise(r=>setTimeout(r,600));
    setPhase("set");
    await speak(sc.set, sc.rate, sc.pitch);
    await new Promise(r=>setTimeout(r,800));
    setPhase("bang");
    gunShot();
    await new Promise(r=>setTimeout(r,1200));
    setPhase("cooldown");
    setTimeout(()=>setPhase("idle"), 2000);
  };

  const PHASES = {
    idle:     { label: lang==="ko"?"🔫 출발 신호":"🔫 Start Signal", bg:"#1e3a8a", sub: lang==="ko"?"탭하면 자동 시퀀스 시작":"Tap to run the full sequence", pulse:false },
    ready:    { label: lang==="ko"?"제자리에…":"On your marks…",     bg:"#78350f", sub: lang==="ko"?"선수 준비 중":"Athletes, take your position",  pulse:true  },
    set:      { label: lang==="ko"?"차렷!":"Get set!",                bg:"#7f1d1d", sub: lang==="ko"?"출발 준비":"Ready to go",                      pulse:true  },
    bang:     { label:"💥 Bang!",                                     bg:"#991b1b", sub: lang==="ko"?"출발!":"GO!",                                  pulse:true  },
    cooldown: { label:"✅ Done",                                      bg:"#14532d", sub: lang==="ko"?"다시 누르면 재시작":"Tap again to restart",     pulse:false },
  };
  const ph = PHASES[phase];
  const sc = SCRIPTS[lang];

  return (
    <div style={{marginBottom:14}}>
      {/* 언어 토글 */}
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        {[{id:"ko",label:"🇰🇷 한국어"},{id:"en",label:"🇺🇸 English"}].map(l=>(
          <button key={l.id} onClick={()=>setLang(l.id)}
            style={{flex:1,padding:"8px 4px",borderRadius:8,
              border:`1.5px solid ${lang===l.id?"#1e3a8a":"#e5e7eb"}`,
              background:lang===l.id?"#1e3a8a":"#fff",
              color:lang===l.id?"#fff":"#37352f",
              fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",
              transition:"all .15s"}}>
            {l.label}
          </button>
        ))}
      </div>

      {/* 자동 시퀀스 */}
      <button onClick={runSequence} disabled={phase!=="idle"&&phase!=="cooldown"}
        style={{width:"100%",padding:"16px 20px",borderRadius:12,border:"none",
          background:ph.bg,cursor:phase==="idle"||phase==="cooldown"?"pointer":"default",
          fontFamily:"inherit",transition:"all .2s",
          animation:ph.pulse?"signalPulse .6s ease-in-out infinite alternate":"none"}}>
        <div style={{fontSize:22,fontWeight:900,color:"#fff",letterSpacing:1,marginBottom:4}}>
          {ph.label}
        </div>
        <div style={{fontSize:12,color:"rgba(255,255,255,.7)",fontWeight:600}}>{ph.sub}</div>
      </button>

      {/* 개별 버튼 */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:6}}>
        {[
          {label: lang==="ko"?"📢 제자리에":"📢 On your marks", fn:()=>speak(sc.ready, sc.rate, sc.pitch)},
          {label: lang==="ko"?"📢 차렷":"📢 Get set",           fn:()=>speak(sc.set,   sc.rate, sc.pitch)},
          {label:"💥 Bang!",                                     fn:()=>gunShot()},
        ].map((b,i)=>(
          <button key={i} onClick={b.fn}
            style={{padding:"9px 4px",borderRadius:8,border:"1.5px solid #e5e7eb",
              background:"#fff",cursor:"pointer",fontFamily:"inherit",
              fontSize:11,fontWeight:700,color:"#37352f",textAlign:"center"}}>
            {b.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function P100Round1({ p, gk }) {
  const gLabel = gk==="m"?"남자":"여자";
  const totalDone = ALL_HEATS_LIST.filter(hk => p.r1[gk]?.[hk]).length;
  const [openRunner, setOpenRunner] = useState(p.current?.runner || 1);

  // 자동 진행 토글
  const [autoAdvance, setAutoAdvance] = useState(true);

  // 1위 선택 처리 + 자동 다음 조 이동
  const handlePick = (runner, groupIdx, hk, winner) => {
    p.setR1Winner(gk, hk, winner);

    // 현재 위치 state 저장 (학생 화면 동기화용)
    p.setCurrent({ gk, runner, group: P100_GKEYS[groupIdx] });

    if(!autoAdvance || !winner) return;

    // 자동 진행: 같은 주자의 다음 조 → 없으면 다음 주자의 a조
    setTimeout(()=>{
      if(groupIdx < P100_GKEYS.length-1) {
        // 다음 조 (같은 주자)
        const nextGroup = P100_GKEYS[groupIdx+1];
        p.setCurrent({ gk, runner, group: nextGroup });
      } else if(runner < 5) {
        // 다음 주자 (a조부터)
        setOpenRunner(runner+1);
        p.setCurrent({ gk, runner: runner+1, group: "a" });
      }
    }, 300);
  };

  return (
    <div>
      <StartSignal/>
      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,
        padding:"10px 14px",marginBottom:12,fontSize:13,color:"#1d4ed8"}}>
        🏃 {gLabel} 50m 달리기 1차전 ({totalDone}/20조 완료)<br/>
        <span style={{fontSize:11}}>
          각 조 5명 → 1위만 2라운드 진출 ·  통과자 +10점
        </span>
      </div>

      {/* 자동 진행 토글 */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",
        background:autoAdvance?"#dcfce7":"#f9fafb",
        border:`1px solid ${autoAdvance?"#86efac":"#e5e7eb"}`,
        borderRadius:8,marginBottom:12}}>
        <span style={{fontSize:18}}>{autoAdvance?"⚡":"⏸"}</span>
        <div style={{flex:1,fontSize:12,fontWeight:700,
          color:autoAdvance?"#15803d":"#787671"}}>
          {autoAdvance ? "자동 진행 ON · 1위 선택 시 다음 조로 자동 이동" : "수동 모드"}
        </div>
        <button onClick={()=>setAutoAdvance(v=>!v)} className="obtn"
          style={{fontSize:11,padding:"5px 10px"}}>
          {autoAdvance ? "수동으로" : "자동으로"}
        </button>
      </div>

      {P100_RUNNERS.map(runner=>{
        const runnerHeats = P100_GKEYS.map(g=>`r${runner}-${g}`);
        const runnerDone  = runnerHeats.filter(hk=>p.r1[gk]?.[hk]).length;
        const isOpen      = openRunner===runner;
        const isCurrent   = p.current?.gk===gk && p.current?.runner===runner;
        return(
          <div key={runner} style={{marginBottom:10}}>
            <button onClick={()=>setOpenRunner(isOpen?-1:runner)}
              style={{width:"100%",padding:"12px 14px",borderRadius:10,
                border:`1.5px solid ${isCurrent?"#f59e0b":"#e5e7eb"}`,
                background:isCurrent?"#fffbeb":isOpen?"#f9fafb":"#fff",
                cursor:"pointer",fontFamily:"inherit",display:"flex",
                alignItems:"center",gap:10,marginBottom:isOpen?6:0}}>
              <span style={{fontWeight:800,fontSize:15,color:"#111827",flex:1,textAlign:"left"}}>
                {isCurrent && "🔴 "}🏃 {runner}번 주자
                {isCurrent && <span style={{fontSize:10,marginLeft:8,color:"#dc2626",fontWeight:700}}>진행중</span>}
              </span>
              <span style={{fontSize:12,color:runnerDone===4?"#16a34a":"#9ca3af",fontWeight:700}}>
                {runnerDone===4?"✅ 완료":`${runnerDone}/4`}
              </span>
              <span style={{color:"#9ca3af",fontSize:12}}>{isOpen?"▴":"▾"}</span>
            </button>
            {isOpen && P100_GKEYS.map((g,gIdx)=>{
              const hk = `r${runner}-${g}`;
              const group = P100_GROUPS[g];
              const winner = p.r1[gk]?.[hk];
              const isCurGroup = isCurrent && p.current?.group===g && !winner;
              return(
                <div key={hk} className="card" style={{marginBottom:6,
                  borderColor:isCurGroup?"#f59e0b":"#e5e7eb",
                  borderWidth:isCurGroup?2:1,
                  background:isCurGroup?"#fffbeb":"#fff"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontWeight:800,fontSize:14,color:"#111827",flex:1}}>
                      {isCurGroup && "▶ "}{group.name}
                    </span>
                    {winner&&<span style={{fontSize:12,color:"#16a34a",fontWeight:700}}>
                      🥇 {winner.name} ({winner.cls}반)
                    </span>}
                  </div>
                  {group.cls.map((cls,lane)=>{
                    const name = p.getRunner(cls,gk,runner-1);
                    const isW = winner?.cls===cls;
                    const team = classToTeam(cls);
                    return(
                      <button key={cls}
                        onClick={()=>handlePick(runner, gIdx, hk, isW?null:{cls,name})}
                        style={{display:"flex",alignItems:"center",gap:10,padding:"9px 11px",
                          borderRadius:8,border:`1.5px solid ${isW?TEAM_COLORS[team]:"#e5e7eb"}`,
                          background:isW?TEAM_BG[team]:"#fff",cursor:"pointer",fontFamily:"inherit",
                          textAlign:"left",width:"100%",marginBottom:4}}>
                        <span style={{fontSize:11,fontWeight:700,color:"#9ca3af",minWidth:38,flexShrink:0}}>
                          {lane+1}레인
                        </span>
                        <TeamBadge team={team} size={26}/>
                        <span style={{flex:1,fontWeight:isW?800:500,fontSize:13,
                          color:isW?TEAM_COLORS[team]:"#374151"}}>
                          {cls}반 · {name}
                        </span>
                        {isW&&<span style={{fontSize:16}}>🥇</span>}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function P100Round3({ p, gk }) {
  const gLabel = gk==="m"?"남자":"여자";

  const r3g = p.r3[gk]||{};

  const sf1w = r3g.sf1?sv.find(s=>s.hk===r3g.sf1):null;
  const sf2w = r3g.sf2?sv.find(s=>s.hk===r3g.sf2):null;

  function VsCard({title,desc,pa,pb,winHk,onPick}){

      return(
        <button onClick={()=>onPick(isW?null:pl.hk)}
          style={{flex:1,padding:"12px 8px",borderRadius:10,
            border:`2px solid ${isW?TEAM_COLORS[tc]:"#e5e7eb"}`,
            background:isW?TEAM_BG[tc]:"#fff",cursor:"pointer",fontFamily:"inherit",
            textAlign:"center",transition:"all .2s"}}>
          <TeamBadge team={tc} size={30}/>

          <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{pl.cls}반</div>
          {isW&&<div style={{fontSize:20,marginTop:6}}>🏆</div>}

    return(
      <div className="card" style={{marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:15,color:"#111827",marginBottom:2}}>{title}</div>
        <div style={{fontSize:12,color:"#9ca3af",marginBottom:12}}>{desc}</div>

          <Slot pl={pa} tc={ta}/>

          <Slot pl={pb} tc={tb}/>

      </div>

  return(
    <div>

      {sv.length>=3&&(
        <VsCard title="⚔️ 준결승 2" desc="⚽ 동시 출발 · 먼저 골 넣으면 승리"

      {sf1w&&(sv.length<3||sf2w)&&(

// ─── 8자마라톤 (운영자) ───
function OTimeTrial({state,update}) {
  const [sel, setSel] = useState(TIME_TRIAL_SPORTS[0]);
  const [showCodes, setShowCodes] = useState(false);
  const counts = state.timeTrial?.[sel]||{};
  const judgeCodes = state.judgeCodes?.[sel]||{};

  const set = (cls, v) => update(s => {
    const cur = {...(s.timeTrial?.[sel]||{})};
    if(v === "" || v === undefined || v === null) {
      delete cur[cls]; // Firebase에 undefined 전달 방지 - 키 자체를 삭제
    } else {
      cur[cls] = v;
    }
    return {...s, timeTrial:{...(s.timeTrial||{}), [sel]:cur}};
  });

  const setCode = (cls, v) => update(s => ({
    ...s, judgeCodes:{ ...(s.judgeCodes||{}),
      [sel]:{ ...(s.judgeCodes?.[sel]||{}), [cls]: v.trim() }}
  }));

  // 랜덤 코드 생성 (6자리 영숫자)
  const genCode = () => {
    const chars = "abcdefghjkmnpqrstuvwxyz23456789";
    return Array.from({length:6}, ()=>chars[Math.floor(Math.random()*chars.length)]).join("");
  };
  const genAllCodes = () => {
    const grade = sel.startsWith("1") ? "1" : "2";
    const cls = ALL_CLASSES.filter(c=>c.startsWith(grade+"-"));
    cls.forEach(c => setCode(c, genCode()));
  };

  // 학년별 학급
  const grade = sel.startsWith("1") ? "1" : "2";
  const gradeClasses = ALL_CLASSES.filter(c => c.startsWith(grade+"-"));
  const filled = gradeClasses.filter(c=>counts[c]!==undefined&&counts[c]!=="").length;
  const ranks = getTimeTrialRanks(counts);

  return(<>
    <div className="page-title">⏱ 8자마라톤</div>
    <div className="page-desc">학년별 10개 반 동시 진행 · 개수 입력 → 큰 수가 1위</div>

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      {TIME_TRIAL_SPORTS.map(sp=>(
        <button key={sp} onClick={()=>setSel(sp)}
          className={`obtn${sel===sp?" on":""}`} style={{flex:1,padding:"12px 0",fontSize:14}}>
          {sp}
        </button>
      ))}
    </div>

    <div className="card" style={{marginBottom:10,background:"#eff6ff",borderColor:"#bfdbfe",padding:"10px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:16}}>📊</span>
        <span style={{fontSize:13,fontWeight:700,color:"#1d4ed8",flex:1}}>
          {sel} · {filled}/10반 입력
        </span>
      </div>
      <div style={{fontSize:11,color:"#1e40af",marginTop:4}}>
        배점: 1위 100 · 2위 90 · 3위 80 · 4위 70 · 5위 60 · 6위 50 · 7위 40 · 8위 30 · 9위 20 · 10위 10
      </div>
    </div>

    {/* 심판 코드 설정 */}
    <div className="card" style={{marginBottom:12,padding:"10px 14px",
      background:"#fffbeb",borderColor:"#fde68a"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom: showCodes?10:0}}>
        <span style={{fontSize:14}}>🔑</span>
        <span style={{fontSize:13,fontWeight:700,color:"#92400e",flex:1}}>
          학생심판 개인 코드
        </span>
        <button onClick={genAllCodes}
          style={{fontSize:11,fontWeight:700,color:"#b45309",background:"#fef3c7",
            border:"1px solid #fde68a",borderRadius:6,padding:"4px 10px",
            cursor:"pointer",fontFamily:"inherit"}}>
          🎲 전체 랜덤 생성
        </button>
        <button onClick={()=>setShowCodes(v=>!v)}
          style={{fontSize:11,fontWeight:700,color:"#92400e",background:"transparent",
            border:"1px solid #fde68a",borderRadius:6,padding:"4px 10px",
            cursor:"pointer",fontFamily:"inherit"}}>
          {showCodes?"접기 ▴":"설정 ▾"}
        </button>
      </div>

      {showCodes && (<>
        <div style={{fontSize:11,color:"#a16207",marginBottom:8,lineHeight:1.6}}>
          각 심판에게 본인 반 코드만 개별 전달하세요.<br/>
          학생 화면 → 8자마라톤 → 하단 입력칸에 코드 입력
        </div>
        {gradeClasses.map(cls=>{
          const code = judgeCodes[cls]||"";
          const team = classToTeam(cls);
          return(
            <div key={cls} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
              <TeamBadge team={team} size={20}/>
              <span style={{fontSize:12,fontWeight:700,color:"#37352f",minWidth:40}}>{cls}반</span>
              <input value={code}
                onChange={e=>setCode(cls, e.target.value)}
                placeholder="코드 입력"
                className="oinput"
                style={{flex:1,fontSize:13,fontWeight:700,padding:"5px 8px",
                  fontFamily:"monospace",letterSpacing:1,
                  background: code?"#fff":"#fef9c3"}}/>
              <button onClick={()=>setCode(cls, genCode())}
                style={{fontSize:11,padding:"5px 8px",borderRadius:6,
                  border:"1px solid #e5e7eb",background:"#fff",
                  cursor:"pointer",fontFamily:"inherit",color:"#6b7280",fontWeight:600}}>
                🎲
              </button>
            </div>
          );
        })}
      </>)}
    </div>

    {/* 잘못된 값 경고 */}
    {gradeClasses.some(c => {
      const raw = counts[c];
      const val = parseFloat(String(raw).replace(",","."));
      return raw !== undefined && raw !== "" && (isNaN(val) || val < 0);
    }) && (
      <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,
        padding:"8px 12px",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:13}}>⚠️</span>
        <span style={{fontSize:12,color:"#b91c1c",flex:1}}>
          잘못된 값(음수 등)이 입력된 반이 있어요
        </span>
        <button onClick={()=>{
          gradeClasses.forEach(c=>{
            const raw = counts[c];
            const val = parseFloat(String(raw).replace(",","."));
            if(raw !== undefined && raw !== "" && (isNaN(val) || val < 0))
              set(c, "");
          });
        }} style={{fontSize:11,fontWeight:700,color:"#b91c1c",
          background:"#fff",border:"1px solid #fecaca",borderRadius:5,
          padding:"4px 10px",cursor:"pointer",fontFamily:"inherit"}}>
          잘못된 값 삭제
        </button>
      </div>
    )}

    {gradeClasses.map(cls=>{
      const team = classToTeam(cls);
      const rank = ranks[cls];
      const v = counts[cls]||"";
      const code = judgeCodes[cls];
      return(
        <div key={cls} className="card" style={{
          marginBottom:6, padding:"10px 14px",
          borderLeft:`4px solid ${TEAM_COLORS[team]}`,
          display:"flex",alignItems:"center",gap:10}}>
          <TeamBadge team={team} size={26}/>
          <div style={{minWidth:60}}>
            <div style={{fontWeight:800,fontSize:15,color:"#37352f"}}>{cls}반</div>
            {code
              ? <div style={{fontSize:10,color:"#92400e",fontWeight:700,
                  fontFamily:"monospace",letterSpacing:.5}}>🔑 {code}</div>
              : <div style={{fontSize:10,color:"#d1d5db"}}>코드 미설정</div>
            }
          </div>
          <input type="number" inputMode="numeric"
            value={v}
            onChange={e=>{
              const val = e.target.value;
              // 음수 입력 방지
              if(val !== "" && parseInt(val) < 0) return;
              set(cls, val);
            }}
            onBlur={e=>{
              const val = e.target.value;
              const num = parseInt(val);
              // blur 시 유효하지 않은 값이면 초기화
              if(val !== "" && (isNaN(num) || num < 0)) {
                set(cls, "");
              }
            }}
            min="0"
            placeholder="개수"
            className="oinput"
            style={{flex:1,fontSize:18,textAlign:"center",fontFamily:"monospace",fontWeight:700,padding:"10px 12px"}}/>
          <span style={{fontSize:13,color:"#787671",fontWeight:600,minWidth:24}}>개</span>
          {rank && (
            <div style={{
              minWidth:54, textAlign:"center", padding:"6px 8px",
              borderRadius:6, background:TEAM_BG[team],
              border:`1.5px solid ${TEAM_COLORS[team]}`,
              fontSize:12, fontWeight:800, color:TEAM_COLORS[team]
            }}>
              {rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":`${rank}위`}<br/>
              <span style={{fontSize:10}}>+{TT_PTS[rank-1]}pt</span>
            </div>
          )}
        </div>
      );
    })}
  </>);
}

// ── 에러 바운더리 (탭 오류 시 빈화면 대신 에러 표시) ──
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error:null}; }
  static getDerivedStateFromError(e) { return {error:e}; }
  componentDidCatch(e) { console.error("TabError:", e); }
  render() {
    if(this.state.error) return (
      <div style={{padding:30,textAlign:"center",color:"#eb5757",fontFamily:"inherit"}}>
        <div style={{fontSize:30,marginBottom:10}}>⚠️</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>오류가 발생했어요</div>
        <div style={{fontSize:12,color:"#9b9a97",marginBottom:16}}>
          {this.state.error.message}
        </div>
        <button onClick={()=>this.setState({error:null})}
          style={{padding:"8px 20px",background:"#37352f",color:"#fff",border:"none",
            borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>
          다시 시도
        </button>
      </div>
    );
    return this.props.children;
  }
}

function SafeTab({children}) {
  return <ErrorBoundary>{children}</ErrorBoundary>;
}

// ════════════════════════════════════════════════════════
//  FootballPitch: 프리미엄 다크 라인업 (Best XI 스타일)
// ════════════════════════════════════════════════════════
function FootballPitch({ half }) {
  const teacher = half?.teacher || { formation:"4-3-3", players:[] };
  const student = half?.student || { grade:"1", formation:"4-4-2", players:[] };
  const score   = half?.score   || { teacher:0, student:0 };
  const goals   = half?.goals   || [];
  const status  = half?.status  || "upcoming";
  const grade   = student.grade || "1";
  const [view, setView] = useState("score"); // "score" | "teacher" | "student"

  const T_BG="#1e3a8a", S_BG="#9f1239", GOLD="#d4af37";

  const parseRows = (formation, players) => {
    const safeP = Array.isArray(players) ? players
      : players && typeof players==="object" ? Object.values(players) : [];
    const counts = [1, ...formation.split("-").map(n=>parseInt(n)||0)];
    let idx=0;
    return counts.map(count => {
      const row=[];
      for(let i=0;i<count;i++) row.push(safeP[idx++]||null);
      return row;
    });
  };

  const goalsByTeam = (t) => goals.filter(g=>g.team===t);

  const statusEl = status==="live"
    ? <span style={{color:"#ef4444",fontWeight:900,fontSize:11,letterSpacing:1,
        animation:"blink 1.2s infinite",display:"inline-block"}}>● LIVE</span>
    : status==="done"
    ? <span style={{color:GOLD,fontWeight:800,fontSize:11,letterSpacing:2}}>FULL TIME</span>
    : <span style={{color:"#64748b",fontWeight:600,fontSize:10,letterSpacing:2}}>PREVIEW</span>;

  // ── 선수 카드 (큰 버전) ──
  const PCard = ({player, color, large}) => {
    if(!player) return <div style={{width:large?70:50,height:large?84:60,margin:"3px 4px"}}/>;
    const photo = player?.photo?.trim();
    const num   = player?.number || "?";
    const name  = player?.name   || "";
    const W = large ? 66 : 50, H = large ? 78 : 58;
    return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",
        margin:"3px 4px",minWidth:W,maxWidth:large?80:66}}>
        <div style={{width:W,height:H,borderRadius:10,overflow:"hidden",position:"relative",
          border:"2px solid rgba(255,255,255,.55)",
          boxShadow:"0 4px 20px rgba(0,0,0,.75)",
          background:photo?"#0a0a0a":`linear-gradient(150deg,${color}99 0%,${color} 60%,${color}ee 100%)`}}>
          {photo ? (
            <img src={photo} alt={name}
              style={{width:"100%",height:"100%",objectFit:"cover",objectPosition:"top center"}}
              onError={e=>{
                e.target.style.display="none";
                e.target.parentElement.style.background=`linear-gradient(150deg,${color}99,${color})`;
              }}/>
          ) : (
            <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",
              alignItems:"center",justifyContent:"center",gap:2}}>
              <div style={{fontSize:large?20:15,opacity:.3,lineHeight:1}}>👤</div>
              <div style={{fontSize:large?22:17,fontWeight:900,color:"rgba(255,255,255,.95)",lineHeight:1}}>{num}</div>
            </div>
          )}
          {photo && (
            <div style={{position:"absolute",bottom:0,left:0,right:0,
              background:"linear-gradient(transparent,rgba(0,0,0,.88))",
              padding:"14px 3px 3px",textAlign:"center",
              fontSize:large?11:9,fontWeight:900,color:"#fff",letterSpacing:.5}}>{num}</div>
          )}
          <div style={{position:"absolute",top:0,left:0,right:0,height:3,
            background:`linear-gradient(90deg,${GOLD}bb,transparent)`}}/>
        </div>
        <div style={{fontSize:large?11:9,color:"#e2e8f0",marginTop:3,
          width:large?72:54,textAlign:"center",fontWeight:700,lineHeight:1.2,
          textShadow:"0 1px 6px rgba(0,0,0,1)",
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",padding:"0 2px"}}>
          {name||num}
        </div>
      </div>
    );
  };

  // ── 단일팀 피치 (큰 카드) ──
  const TeamPitch = ({teamKey}) => {
    const isTeacher = teamKey==="teacher";
    const teamData  = isTeacher ? teacher : student;
    const color     = isTeacher ? T_BG : S_BG;
    const rows = parseRows(teamData.formation||"4-4-2", teamData.players||[]);
    const dr   = isTeacher ? rows : [...rows].reverse(); // 학생은 FW위→GK아래
    const teamGoals = goalsByTeam(teamKey);

    return (
      <div style={{borderRadius:14,overflow:"hidden",
        boxShadow:"0 8px 40px rgba(0,0,0,.5)"}}>

        {/* 팀 헤더 */}
        <div style={{
          background: isTeacher
            ? `linear-gradient(135deg,#111827,${T_BG})`
            : `linear-gradient(135deg,${S_BG},#7f1d1d)`,
          padding:"12px 16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <span style={{color:"#fff",fontWeight:900,fontSize:16}}>
              {isTeacher ? "👨‍🏫 교사팀" : `🎓 ${grade}학년`}
            </span>
            <span style={{color:isTeacher?"#93c5fd":"#fca5a5",fontSize:13,fontWeight:700,
              background:"rgba(255,255,255,.12)",padding:"3px 10px",borderRadius:10}}>
              {teamData.formation}
            </span>
          </div>
          {/* 스코어 미니 */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:28,fontWeight:900,color:"#fff",lineHeight:1,
              textShadow:`0 0 20px ${isTeacher?"rgba(59,130,246,.6)":"rgba(239,68,68,.6)"}`}}>
              {isTeacher ? score.teacher : score.student}
            </span>
            <div style={{flex:1}}>
              {teamGoals.length>0
                ? <div style={{fontSize:11,color:"rgba(255,255,255,.75)",lineHeight:1.5}}>
                    ⚽ {teamGoals.map(g=>`${g.name}${g.time?" "+g.time:""}`).join("  ·  ")}
                  </div>
                : <div style={{fontSize:11,color:"rgba(255,255,255,.35)"}}>득점 없음</div>
              }
            </div>
            <div>{statusEl}</div>
          </div>
        </div>

        {/* 피치 */}
        <div style={{background:"linear-gradient(180deg,#0a2410 0%,#0c3318 30%,#0e4020 50%,#0c3318 70%,#0a2410 100%)",
          position:"relative",padding:"10px 4px"}}>
          {/* 필드 장식 */}
          <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
            <div style={{position:"absolute",left:"10%",right:"10%",top:"50%",height:1,
              background:"rgba(255,255,255,.12)",transform:"translateY(-50%)"}}/>
            <div style={{position:"absolute",left:"50%",top:"50%",width:36,height:36,
              borderRadius:"50%",border:"1px solid rgba(255,255,255,.12)",
              transform:"translate(-50%,-50%)"}}/>
            <div style={{position:"absolute",left:"20%",right:"20%",top:"4%",height:28,
              border:"1px solid rgba(255,255,255,.08)",borderTop:"none"}}/>
            <div style={{position:"absolute",left:"20%",right:"20%",bottom:"4%",height:28,
              border:"1px solid rgba(255,255,255,.08)",borderBottom:"none"}}/>
          </div>
          {dr.map((row,ri)=>(
            <div key={ri} style={{display:"flex",justifyContent:"center",
              alignItems:"flex-end",flexWrap:"wrap",marginBottom:8}}>
              {row.map((p,pi)=><PCard key={pi} player={p} color={color} large={true}/>)}
            </div>
          ))}
        </div>
      </div>
    );
  };

  // ── 스코어 보드 뷰 ──
  const ScoreView = () => (
    <div style={{borderRadius:14,overflow:"hidden",
      background:"linear-gradient(180deg,#060d1a,#050810)",
      boxShadow:"0 8px 40px rgba(0,0,0,.5)"}}>

      {/* 골드 타이틀 */}
      <div style={{borderBottom:`2px solid ${GOLD}`,padding:"14px 16px 12px",textAlign:"center"}}>
        <div style={{fontSize:9,color:GOLD,fontWeight:700,letterSpacing:4,marginBottom:4,
          textTransform:"uppercase"}}>한마음 스포츠데이 · 골때녀</div>
        <div style={{fontSize:17,color:"#fff",fontWeight:900,letterSpacing:1.5,
          textShadow:`0 0 20px ${GOLD}55`}}>
          교사팀 ⚔️ {grade}학년
        </div>
      </div>

      {/* 스코어 */}
      <div style={{padding:"20px 20px",display:"flex",alignItems:"center"}}>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontSize:11,color:"#93c5fd",fontWeight:700,letterSpacing:1,marginBottom:8}}>교사팀</div>
          <div style={{fontSize:64,fontWeight:900,color:"#fff",lineHeight:1,
            textShadow:"0 0 40px rgba(59,130,246,.6)"}}>{score.teacher}</div>
          {goalsByTeam("teacher").length>0 && (
            <div style={{fontSize:11,color:"#93c5fd",marginTop:8,lineHeight:1.6}}>
              {goalsByTeam("teacher").map(g=>`⚽ ${g.name}${g.time?" "+g.time:""}`).join("\n")}
            </div>
          )}
        </div>
        <div style={{padding:"0 10px",textAlign:"center",minWidth:52}}>
          <div style={{marginBottom:6}}>{statusEl}</div>
          <div style={{fontSize:28,color:"#1e293b",fontWeight:100,lineHeight:1}}>:</div>
        </div>
        <div style={{flex:1,textAlign:"center"}}>
          <div style={{fontSize:11,color:"#fca5a5",fontWeight:700,letterSpacing:1,marginBottom:8}}>{grade}학년</div>
          <div style={{fontSize:64,fontWeight:900,color:"#fff",lineHeight:1,
            textShadow:"0 0 40px rgba(239,68,68,.6)"}}>{score.student}</div>
          {goalsByTeam("student").length>0 && (
            <div style={{fontSize:11,color:"#fca5a5",marginTop:8,lineHeight:1.6}}>
              {goalsByTeam("student").map(g=>`⚽ ${g.name}${g.time?" "+g.time:""}`).join("\n")}
            </div>
          )}
        </div>
      </div>

      {/* 라인업 탭 안내 */}
      <div style={{borderTop:`1px solid rgba(255,255,255,.08)`,
        padding:"10px 16px",display:"flex",gap:8}}>
        <button onClick={()=>setView("teacher")}
          style={{flex:1,padding:"10px 8px",borderRadius:8,border:"1.5px solid #1e3a8a",
            background:"#1e3a8a22",color:"#93c5fd",fontWeight:700,fontSize:12,
            cursor:"pointer",fontFamily:"inherit"}}>
          👨‍🏫 교사팀 라인업 →
        </button>
        <button onClick={()=>setView("student")}
          style={{flex:1,padding:"10px 8px",borderRadius:8,border:`1.5px solid ${S_BG}`,
            background:`${S_BG}22`,color:"#fca5a5",fontWeight:700,fontSize:12,
            cursor:"pointer",fontFamily:"inherit"}}>
          🎓 {grade}학년 라인업 →
        </button>
      </div>
    </div>
  );

  // ── 탭 헤더 ──
  const TabBar = () => (
    <div style={{display:"flex",gap:6,marginBottom:10}}>
      {[
        {id:"score",   label:"📊 스코어",      color:"#475569"},
        {id:"teacher", label:"👨‍🏫 교사팀",    color:T_BG},
        {id:"student", label:`🎓 ${grade}학년`, color:S_BG},
      ].map(t=>(
        <button key={t.id} onClick={()=>setView(t.id)}
          style={{flex:1,padding:"9px 4px",borderRadius:8,
            border:`1.5px solid ${view===t.id?t.color:"#e5e7eb"}`,
            background:view===t.id?t.color:"#fff",
            color:view===t.id?"#fff":"#374151",
            fontWeight:view===t.id?800:600,fontSize:12,
            cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>
          {t.label}
        </button>
      ))}
    </div>
  );

  return (

// ════════════════════════════════════════════════════════
//  OGolddanya: 운영자 - 골때녀 엔트리/점수/득점 관리
// ════════════════════════════════════════════════════════
function OGolddanya({ state, update }) {
  const [halfTab,   setHalfTab]  = useState("half1");
  const [goalTeam,  setGoalTeam] = useState("teacher");
  const [goalName,  setGoalName] = useState("");
  const [goalTime,  setGoalTime] = useState("");
  const gd   = state.golddanya || {};
  const half = gd[halfTab] || {};
  const grade = halfTab==="half1" ? "1" : "2";

  const FORMATIONS = ["4-3-3","4-4-2","4-2-3-1","3-5-2","3-4-3","4-1-4-1","5-3-2"];
  const STATUS_OPTS = [
    {id:"upcoming",label:"⏳ 예정",   color:"#6b7280"},
    {id:"live",    label:"🔴 진행 중", color:"#ef4444"},
    {id:"done",    label:"✅ 종료",   color:"#16a34a"},
  ];

  const upd = (patch) => update(s=>({
    ...s, golddanya:{...(s.golddanya||{}),
      [halfTab]:{...(s.golddanya?.[halfTab]||{}),...patch}}
  }));
  const updTeam = (team,patch) => upd({[team]:{...(half[team]||{}),...patch}});
  const updScore = (team,delta) => {
    const c = half.score||{teacher:0,student:0};
    upd({score:{...c,[team]:Math.max(0,(c[team]||0)+delta)}});
  };
  const setPlayerField = (team,idx,field,val) => {
    const raw = half[team]?.players;
    // Firebase가 배열을 객체로 저장할 수 있음 → 안전하게 변환
    const ps = Array.isArray(raw) ? [...raw]
      : raw && typeof raw==="object" ? Object.values(raw)
      : [];
    while(ps.length<=idx) ps.push({name:"",number:""});
    if(!ps[idx]||typeof ps[idx]!=="object") ps[idx]={};
    ps[idx]={...ps[idx],[field]:val};
    updTeam(team,{players:ps});
  };
  const getPlayers = (team) => {
    const raw = half[team]?.players;
    const ps = Array.isArray(raw) ? [...raw]
      : raw && typeof raw==="object" ? Object.values(raw)
      : [];
    const result = ps.map(p=>(p&&typeof p==="object"?p:{name:"",number:"",photo:""}));
    while(result.length<11) result.push({name:"",number:"",photo:""});
    return result.slice(0,11);
  };
  const submitGoal = () => {
    if(!goalName.trim()) return;
    upd({goals:[...(half.goals||[]),{team:goalTeam,name:goalName.trim(),time:goalTime.trim(),id:Date.now()}]});
    setGoalName(""); setGoalTime("");
  };
  const removeGoal = (id) => upd({goals:(half.goals||[]).filter(g=>g.id!==id)});

  return(<>
    <div className="page-title">⚽ 골때녀 관리</div>
    <div className="page-desc">전/후반 라인업 등록 · 득점 입력 · 학생 화면 실시간 반영</div>

    {/* 전/후반 탭 */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
      <button onClick={()=>setHalfTab("half1")} className={`obtn${halfTab==="half1"?" on":""}`}
        style={{padding:"10px",fontSize:13}}>⚽ 전반전 (1학년)</button>
      <button onClick={()=>setHalfTab("half2")} className={`obtn${halfTab==="half2"?" on":""}`}
        style={{padding:"10px",fontSize:13}}>⚽ 후반전 (2학년)</button>
    </div>

    {/* 경기 상태 */}
    <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#787671",marginBottom:8}}>경기 상태</div>
      <div style={{display:"flex",gap:6}}>
        {STATUS_OPTS.map(o=>{
          const on=(half.status||"upcoming")===o.id;
          return(
            <button key={o.id} onClick={()=>upd({status:o.id})} className="obtn"
              style={{flex:1,padding:"8px 4px",fontSize:12,fontWeight:700,
                background:on?o.color:"#fff",color:on?"#fff":"#37352f",
                borderColor:on?o.color:"#e7e7e5"}}>
              {o.label}
            </button>
          );
        })}
      </div>
    </div>

    {/* 라인업 미리보기 */}
    <div className="sl">📺 라인업 미리보기</div>
    <div style={{borderRadius:12,overflow:"hidden",marginBottom:14}}>
      <FootballPitch half={half}/>
    </div>

    {/* 포메이션 선택 */}
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontSize:12,fontWeight:700,color:"#787671",marginBottom:10}}>포메이션 설정</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {["teacher","student"].map(team=>(
          <div key={team}>
            <div style={{fontSize:11,color:"#9b9a97",fontWeight:600,marginBottom:4}}>
              {team==="teacher"?"👨‍🏫 교사팀":`🎓 ${grade}학년`}
            </div>
            <select value={half[team]?.formation||"4-4-2"}
              onChange={e=>updTeam(team,{formation:e.target.value})}
              className="oinput" style={{fontSize:13}}>
              {FORMATIONS.map(f=><option key={f} value={f}>{f}</option>)}
            </select>
          </div>
        ))}
      </div>
    </div>

    {/* 선수 명단 입력 */}
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontSize:12,fontWeight:700,color:"#787671",marginBottom:12}}>선수 명단 (각 11명)</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <PlayerInputGrid team="teacher" label="교사팀" color="#1e3a8a"
          players={getPlayers("teacher")} onFieldChange={setPlayerField}/>
        <PlayerInputGrid team="student" label={`${grade}학년`} color="#9f1239"
          players={getPlayers("student")} onFieldChange={setPlayerField}/>
      </div>
    </div>

    {/* 득점 관리 */}
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontSize:12,fontWeight:700,color:"#787671",marginBottom:12}}>득점 관리</div>

      {/* 스코어 +/- */}
      <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:10,
        alignItems:"center",marginBottom:14}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:11,color:"#787671",fontWeight:700,marginBottom:6}}>교사팀</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <button onClick={()=>updScore("teacher",-1)} className="obtn"
              style={{width:36,height:36,padding:0,fontSize:20,fontWeight:700}}>−</button>
            <span style={{fontSize:32,fontWeight:900,color:"#1e3a8a",minWidth:42,textAlign:"center",lineHeight:1}}>
              {half.score?.teacher||0}
            </span>
            <button onClick={()=>updScore("teacher",1)} className="obtn primary"
              style={{width:36,height:36,padding:0,fontSize:20,fontWeight:700}}>+</button>
          </div>
        </div>
        <div style={{fontSize:20,color:"#d1d5db",fontWeight:300,textAlign:"center"}}>-</div>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:11,color:"#787671",fontWeight:700,marginBottom:6}}>{grade}학년</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <button onClick={()=>updScore("student",-1)} className="obtn"
              style={{width:36,height:36,padding:0,fontSize:20,fontWeight:700}}>−</button>
            <span style={{fontSize:32,fontWeight:900,color:"#9f1239",minWidth:42,textAlign:"center",lineHeight:1}}>
              {half.score?.student||0}
            </span>
            <button onClick={()=>updScore("student",1)} className="obtn primary"
              style={{width:36,height:36,padding:0,fontSize:20,fontWeight:700}}>+</button>
          </div>
        </div>
      </div>

      {/* 득점자 추가 */}
      <div style={{background:"#f9fafb",borderRadius:8,padding:10,marginBottom:8}}>
        <div style={{fontSize:12,fontWeight:700,color:"#37352f",marginBottom:8}}>⚽ 득점자 추가</div>
        <div style={{display:"flex",gap:5,marginBottom:6}}>
          {[{id:"teacher",label:"교사팀",c:"#1e3a8a"},{id:"student",label:`${grade}학년`,c:"#9f1239"}].map(o=>(
            <button key={o.id} onClick={()=>setGoalTeam(o.id)}
              style={{flex:1,padding:"6px 4px",fontSize:12,borderRadius:6,
                border:`1.5px solid ${goalTeam===o.id?o.c:"#e7e7e5"}`,

        </div>
        <div style={{display:"flex",gap:5}}>
          <input value={goalName} onChange={e=>setGoalName(e.target.value)}

      {/* 득점자 목록 */}
