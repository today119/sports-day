function nextPow2(n) { let p=1; while(p<n) p*=2; return p; }

function buildSeeds(participants) {
  const size = nextPow2(participants.length);
  const seeds = [...participants];
  while(seeds.length < size) seeds.push("BYE");
  return seeds;
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function computeBracket(seeds, results) {
  // 5팀 특수 대진: 1부전승, 4-5(M1), 2-3(M2), M2승자-1(M3), M1승자-M3승자(결승)
  if(seeds.length === 5) return compute5SpecialBracket(seeds, results);
  // 기타: 일반 토너먼트
  return computeStandardBracket(seeds, results);
}

// ── 5팀 특수 대진 ──
// 1라운드: 2 vs 3 (한 경기만)
// 준결승: (2vs3 승자) vs 1    /    4 vs 5
// 결승: 두 준결승 승자
function compute5SpecialBracket(seeds, results) {
  const [s1, s2, s3, s4, s5] = seeds;
  results = results || {};

  // m1 (1라운드): 2 vs 3
  const m1Winner = results.m1;
  const m1Loser  = m1Winner ? (m1Winner===s2?s3:s2) : null;

  // sf1 (준결승 1): m1 승자 vs 1
  const sf1Winner = results.sf1;
  const sf1Loser  = sf1Winner ? (sf1Winner===s1 ? m1Winner : s1) : null;

  // sf2 (준결승 2): 4 vs 5
  const sf2Winner = results.sf2;
  const sf2Loser  = sf2Winner ? (sf2Winner===s4?s5:s4) : null;

  // 결승: sf1 승자 vs sf2 승자
  const finalWinner = results.f;
  const finalLoser  = finalWinner ? (finalWinner===sf1Winner?sf2Winner:sf1Winner) : null;

  return {
    type: "5special",
    seeds, results,
    matches: [
      { id:"m1",  round:1, label:"1차전",   a:s2, b:s3,                 winner:m1Winner||null },
      { id:"sf1", round:2, label:"준결승 ①", a:m1Winner||"?", b:s1,      winner:sf1Winner||null },
      { id:"sf2", round:2, label:"준결승 ②", a:s4, b:s5,                 winner:sf2Winner||null },
      { id:"f",   round:3, label:"결승",     a:sf1Winner||"?", b:sf2Winner||"?", winner:finalWinner||null },
    ],
    ranks: {
      ...(finalWinner&&{[finalWinner]:1}),     // 1위: 결승 승자
      ...(finalLoser &&{[finalLoser]:2}),      // 2위: 결승 패자
      ...(sf1Loser   &&{[sf1Loser]:3}),        // 3위(공동): 준결승① 패자
      ...(sf2Loser   &&{[sf2Loser]:4}),        // 4위(공동): 준결승② 패자
      ...(m1Loser    &&{[m1Loser]:5}),         // 5위: 1차전 패자
    }
  };
}

// ── 일반 토너먼트 (호환용) ──
function computeStandardBracket(seeds, results) {
  results = results || {};
  const size = nextPow2(seeds.length);
  const rounds = Math.log2(size);
  const matches = [];
  let idCounter = 0;
  // 1라운드
  let prev = [];
  for(let i=0; i<size; i+=2) {
    const a = seeds[i]||null, b = seeds[i+1]||null;
    const id = "m"+(idCounter++);
    const winner = (a&&!b)?a : (b&&!a)?b : results[id]||null;
    matches.push({id, round:1, a, b, winner});
    prev.push({id, winner});
  }
  for(let r=2; r<=rounds; r++) {
    const next = [];
    for(let i=0; i<prev.length; i+=2) {
      const a = prev[i]?.winner, b = prev[i+1]?.winner;
      const id = "m"+(idCounter++);
      const winner = results[id]||null;
      matches.push({id, round:r, a, b, winner});
      next.push({id, winner});
    }
    prev = next;
  }
  const ranks = {};
  // 결승 결과로 1,2위 / 준결승 결과로 3,4위
  const finalMatch = matches[matches.length-1];
  if(finalMatch?.winner) {
    ranks[finalMatch.winner] = 1;
    const loser = finalMatch.a===finalMatch.winner?finalMatch.b:finalMatch.a;
    if(loser) ranks[loser] = 2;
  }
  return { type:"standard", seeds, results, matches, ranks };
}


function getRoundName(roundIdx, totalRounds) {
  const fromEnd = totalRounds - roundIdx;
  if(fromEnd===1) return "🏆 결승";
  if(fromEnd===2) return "🥊 4강 (준결승)";
  if(fromEnd===3) return "⚔️ 8강";
  if(fromEnd===4) return "🔹 16강";
  return `🔸 ${roundIdx+1}라운드`;
}

function getBracketRanks(bracket) {
  if(!bracket?.seeds) return {};
  const b = computeBracket(bracket.seeds, bracket.results);
  return b.ranks||{};
}

// ─── 종합 점수 계산 ───
// 시간 파싱 (MM:SS.ms 또는 SS.ms 또는 초)
function parseTime(t) {
  if(!t||!t.trim()) return Infinity;
  const s = t.trim().replace(",",".");
  const parts = s.split(":");
  if(parts.length===2) return parseFloat(parts[0])*60+parseFloat(parts[1]);
  return parseFloat(s);
}

// 8자마라톤: 개수 입력 → 큰 수가 1위
function parseCount(v) {
  if(v===null||v===undefined||v==="") return -1;
  const n = parseFloat(String(v).replace(",","."));
  if(isNaN(n)||n<0) return -1;
  return n;
}
function getTimeTrialRanks(counts) {
  const entries = Object.entries(counts||{})
    .filter(([,c])=>parseCount(c)>=0)
    .sort((a,b)=>parseCount(b[1])-parseCount(a[1])); // 큰 수가 1위
  const ranks={};
  entries.forEach(([cls],i)=>{ ranks[cls]=i+1; });
  return ranks;
}

function calcScores(state) {
  const classPts = {};

  // ── 8자마라톤: 학년별 개수 입력 → 큰 수가 1위 ──
  for(const sp of TIME_TRIAL_SPORTS) {
    const counts = state.timeTrial?.[sp]||{};
    const ranks  = getTimeTrialRanks(counts);
    for(const [cls, rank] of Object.entries(ranks))
      classPts[cls] = (classPts[cls]||0) + (TT_PTS[rank-1]||0);
  }

  // ── 팀 토너먼트 (줄다리기): 대진표 순위 ──
  for(const sp of TEAM_TOURN_SPORTS) {
    const br = state.brackets?.[sp]||{};
    const sr = state.scores?.[sp]||{};
    if(br.drawn) {
      const ranks = getBracketRanks(br);
      const pts = SPORT_PTS[sp]||[];
      for(const [team, rank] of Object.entries(ranks)) {
        const p = pts[rank-1]||0;
        if(p) for(const cls of TEAM_MAP[team])
          classPts[cls] = (classPts[cls]||0) + p;
      }
    } else {
      for(const [cls, rank] of Object.entries(sr))
        classPts[cls] = (classPts[cls]||0) + (SPORT_PTS[sp]?.[rank-1]||0);
    }
  }

  // ── 조별 종목 (장애물달리기): 각 조 1~5위 ──
  const gs = state.groupScores||{};
  for(const gk of GRP_KEYS) {
    const gResult = gs["장애물달리기"]?.[gk]||{};
    for(const [cls, rank] of Object.entries(gResult))
      classPts[cls] = (classPts[cls]||0) + (GRP_PTS[rank-1]||0);
  }

  // ── 태풍의눈: 5조 × 4학급, 1~4위 배점 ──
  for(const gk of TYP_KEYS) {
    const gResult = gs["태풍의눈"]?.[gk]||{};
    for(const [cls, rank] of Object.entries(gResult))
      classPts[cls] = (classPts[cls]||0) + (TYP_PTS[rank-1]||0);
  }

  // ── 계주: 예선(조별 1~5위) + 결승(1~4위 차등) ──
  const relayGs = gs["계주"]||{};
  const rf = state.relayFinals||{};
  const finalClsSet = new Set([
    ...Object.keys(rf.grade1||{}),
    ...Object.keys(rf.grade2||{})
  ]);

  for(const gk of GRP_KEYS) {
    const gResult = relayGs[gk]||{};
    for(const [cls, rank] of Object.entries(gResult)) {
      if(!finalClsSet.has(cls)) {
        // 예선 탈락: 동일 점수
        classPts[cls] = (classPts[cls]||0) + RELAY_ELIM_PTS;
      }
    }
  }
  // 결승 점수
  for(const gradeKey of ["grade1","grade2"]) {
    for(const [cls, rank] of Object.entries(rf[gradeKey]||{}))
      classPts[cls] = (classPts[cls]||0) + (RELAY_FINAL_PTS[rank-1]||0);
  }

  // ── 피지컬100: 학생 1인당 진출 단계별 점수 ──
  const p100 = state.p100||{};
  for(const gk of ["m","f"]) {
    const r1     = p100.r1?.[gk]||{};
    const r2elim = p100.r2elim?.[gk]||[];
    const r3     = p100.r3?.[gk]||{};
    for(const [hk, w] of Object.entries(r1)) {
      if(!w?.cls) continue;
      classPts[w.cls] = (classPts[w.cls]||0) + P100_PTS.r2;    // 2차전 진출 +10
      if(!r2elim.includes(hk))
        classPts[w.cls] = (classPts[w.cls]||0) + P100_PTS.r3;  // 3차전 진출 +10
    }
    if(r3.final && r1[r3.final]?.cls)
      classPts[r1[r3.final].cls] = (classPts[r1[r3.final].cls]||0) + P100_PTS.win; // 우승 +30
  }

  // ── 응원전: 학급별 채점 → 학년별 순위 → 점수 (종합순위 미포함) ──
  // 응원전은 별도 표시용으로만, 종합점수에 미반영

  // ── 팀별 합산 ──
  const teamPts = {};
  for(const team of TEAM_NAMES) {
    teamPts[team] = TEAM_MAP[team].reduce((s,c)=>s+(classPts[c]||0), 0);
  }
  return { classPts, teamPts };
}


function getRankGroups(pts) {
  const groups=[]; let i=0;
  while(i<pts.length){
    const val=pts[i],start=i+1;
    while(i<pts.length&&pts[i]===val)i++;
    groups.push({rank:start,endRank:i,pts:val,label:start===i?`${start}위`:`${start}~${i}위`});
  }
  return groups;
}

// ─── Hook ───
// 운영자: Firebase SDK 실시간 연결 (1개)
// 뷰어(학생): REST API 폴링 + 데이터 절약 모드
//  ① 폴링 간격 15초
//  ② "수정시각만" 먼저 받기 → 변경 시에만 전체 데이터 (98% 절약)
//  ③ 화면이 보이지 않으면 폴링 중지 (잠금/탭 전환 시)
//  ④ 수동 새로고침 함수 (window.refreshData)
function useStore(isOp) {
  const [state,setState]=useState(INIT());
  const [ready,setReady]=useState(false);
  const [online,setOnline]=useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const luRef = useRef(0);
  const fetchingRef = useRef(false);

  useEffect(()=>{
    if(isOp) {
      // ── 운영자: SDK 실시간 리스너 ──
      const ref = getDB();
      ref.on("value", snap => {
        const data = snap.val();
        if(data){ setState(()=>({...INIT(),...data})); luRef.current=data.lu||0; }
        setReady(true);
      }, err=>{ console.error(err); setReady(true); });
      const connRef = firebase.database().ref(".info/connected");
      connRef.on("value", snap=>setOnline(!!snap.val()));
      return ()=>{ ref.off(); connRef.off(); };

    } else {
      // ── 뷰어: 데이터 절약 폴링 ──
      const POLL_MS = 15000; // 15초마다
      let timer = null;
      let stopped = false;

      async function fetchData(force=false) {
        if(stopped || fetchingRef.current) return;
        // 화면이 안 보이면 polling 중지 (force 시 무시)
        if(!force && document.visibilityState === "hidden") {
          timer = setTimeout(fetchData, POLL_MS);
          return;
        }
        fetchingRef.current = true;
        try {
          const cfg = JSON.parse(localStorage.getItem("hanmaeum_firebase_cfg")||"{}");
          if(!cfg.databaseURL) { fetchingRef.current=false; return; }
          const base = cfg.databaseURL.replace(/\/$/, "");

          // ① 먼저 lu(수정시각)만 받기 — ~30 bytes
          const luRes = await fetch(`${base}/${SK}/lu.json`, {cache:"no-store"});
          if(!luRes.ok) throw new Error(luRes.status);
          const lu = await luRes.json();

          // ② 변경 있을 때만 전체 데이터 받기
          if((lu||0) > luRef.current) {
            const res = await fetch(`${base}/${SK}.json`, {cache:"no-store"});
            if(!res.ok) throw new Error(res.status);
            const data = await res.json();
            if(data){
              luRef.current = data.lu||0;
              const merged = {...INIT(),...data};
              // schedule: Firebase에 없거나 빈 배열이면 SCHED_DEFAULT 사용
              if(!data.schedule || data.schedule.length===0) {
                merged.schedule = SCHED_DEFAULT;
              }
              setState(()=>merged);
            }
          } else if(!ready) {
            const res = await fetch(`${base}/${SK}.json`, {cache:"no-store"});
            const data = await res.json();
            if(data){
              luRef.current=data.lu||0;
              const merged = {...INIT(),...data};
              if(!data.schedule || data.schedule.length===0) merged.schedule=SCHED_DEFAULT;
              setState(()=>merged);
            }
          }
          setOnline(true);
          setReady(true);
        } catch(e) {
          setOnline(false);
          setReady(true);
        } finally {
          fetchingRef.current = false;
          setRefreshing(false);
        }
        if(!stopped) timer = setTimeout(fetchData, POLL_MS);
      }

      // ── 화면 보일 때마다 즉시 새로고침 ──
      function onVisChange() {
        if(document.visibilityState === "visible") {
          clearTimeout(timer);
          fetchData(true);
        }
      }
      document.addEventListener("visibilitychange", onVisChange);

      // ── 수동 새로고침 함수 (전역 노출) ──
      window.__refreshData = () => {
        setRefreshing(true);
        clearTimeout(timer);
        fetchData(true);
      };

      fetchData(true);
      return () => {
        stopped = true;
        clearTimeout(timer);
        document.removeEventListener("visibilitychange", onVisChange);
      };
    }
  }, [isOp]);

  const update=patch=>setState(s=>{
    const n=typeof patch==="function"?patch(s):{...s,...patch};
    sv(n);
    return n;
  });

  const refresh = () => { if(window.__refreshData) window.__refreshData(); };

  return {state,update,ready,online,refresh,refreshing};
}

// ── 학생심판 기록 입력 패널 (독립 컴포넌트) ──
function StudentJudgePanel({sel, state}) {
  const [judgeStep, setJudgeStep] = useState("login");
  const [pwdInput, setPwdInput]   = useState("");
  const [myClass,  setMyClass]    = useState(null);
  const [countVal, setCountVal]   = useState("");
  const [saving,   setSaving]     = useState(false);
  const [errMsg,   setErrMsg]     = useState("");

  const grade = sel.startsWith("1") ? "1" : "2";
  const counts = state.timeTrial?.[sel]||{};
  const gradeClasses = ALL_CLASSES.filter(c=>c.startsWith(grade+"-"));

  const checkPwd = () => {
    const trimmed = pwdInput.trim().toLowerCase();
    if(!trimmed) { setErrMsg("코드를 입력해주세요"); return; }
    const matched = gradeClasses.find(c => {
      const num = c.split("-")[1].padStart(2,"0");
      return trimmed === "yj"+num;
    });
    if(!matched) { setErrMsg("코드가 올바르지 않습니다"); return; }
    const existing = counts[matched];
    setMyClass(matched);
    if(existing !== undefined) setCountVal(String(existing));
    setErrMsg("");
    setJudgeStep("input");
  };

  const saveCount = async () => {
    const num = parseInt(countVal);
    if(isNaN(num)||num<0) { setErrMsg("올바른 횟수를 입력해주세요"); return; }
    setSaving(true);
    try {
      const url = `${window.FIREBASE_URL}/timeTrial/${encodeURIComponent(sel)}/${encodeURIComponent(myClass)}.json`;
      const res = await fetch(url,{method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(num)});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      setJudgeStep("done");
    } catch(e) { setErrMsg("저장 실패: "+e.message); }
    setSaving(false);
  };

  return (
    <div className="card" style={{marginTop:12,
      background:"linear-gradient(135deg,#eff6ff,#f0fdf4)",
      border:"2px solid #bfdbfe"}}>
      <div style={{fontSize:13,fontWeight:800,color:"#1e40af",marginBottom:10,
        display:"flex",alignItems:"center",gap:6}}>
        ✏️ 학생심판 기록 입력
        <span style={{fontSize:11,color:"#6b7280",fontWeight:500}}>
          ({grade}학년 담당 심판용)
        </span>
      </div>

      {judgeStep==="login" && (<>
        <div style={{fontSize:12,color:"#374151",marginBottom:8}}>
          담당 선생님께 받은 코드를 입력하세요
        </div>
        <div style={{display:"flex",gap:6}}>
          <input value={pwdInput} onChange={e=>setPwdInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&checkPwd()}
            placeholder="••••" type="password" className="oinput"
            style={{flex:1,fontSize:22,fontWeight:800,textAlign:"center",padding:"10px",letterSpacing:4}}/>
          <button onClick={checkPwd} className="obtn primary"
            style={{padding:"10px 18px",fontSize:14,fontWeight:800}}>확인</button>
        </div>
        {errMsg&&<div style={{color:"#dc2626",fontSize:12,marginTop:6}}>{errMsg}</div>}
      </>)}

      {judgeStep==="input" && (<>
        <div style={{marginBottom:10,padding:"8px 12px",background:"#fff",
          borderRadius:8,border:"1px solid #e5e7eb",
          display:"flex",alignItems:"center",gap:8}}>
          <TeamBadge team={classToTeam(myClass)} size={28}/>
          <span style={{fontWeight:800,fontSize:16,color:"#37352f"}}>{myClass}반</span>
          <span style={{fontSize:12,color:"#9ca3af",marginLeft:"auto"}}>담당 학급</span>
        </div>
        <div style={{fontSize:12,color:"#374151",marginBottom:8}}>
          줄넘기 8자 통과 횟수 입력 (경기 종료 후 입력)
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button onClick={()=>setCountVal(v=>String(Math.max(0,(parseInt(v)||0)-1)))}
            style={{width:44,height:44,borderRadius:8,border:"1.5px solid #e5e7eb",
              background:"#fff",fontSize:22,fontWeight:700,cursor:"pointer",flexShrink:0}}>−</button>
          <input value={countVal} onChange={e=>setCountVal(e.target.value)}
            type="number" inputMode="numeric" className="oinput"
            style={{flex:1,fontSize:32,fontWeight:900,textAlign:"center",padding:"8px"}}/>
          <button onClick={()=>setCountVal(v=>String((parseInt(v)||0)+1))}
            style={{width:44,height:44,borderRadius:8,border:"1.5px solid #e5e7eb",
              background:"#fff",fontSize:22,fontWeight:700,cursor:"pointer",flexShrink:0}}>+</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:8}}>
          <button onClick={()=>{setJudgeStep("login");setPwdInput("");setMyClass(null);setCountVal("");setErrMsg("");}}
            className="obtn" style={{padding:"10px",fontSize:13,fontWeight:700}}>← 돌아가기</button>
          <button onClick={saveCount} disabled={saving} className="obtn primary"
            style={{padding:"10px",fontSize:14,fontWeight:800}}>
            {saving?"저장 중...":"💾 기록 저장"}
          </button>
        </div>
        {errMsg&&<div style={{color:"#dc2626",fontSize:12,marginTop:6}}>{errMsg}</div>}
      </>)}

      {judgeStep==="done" && (<>
        <div style={{textAlign:"center",padding:"16px 0"}}>
          <div style={{fontSize:40,marginBottom:8}}>✅</div>
          <div style={{fontSize:16,fontWeight:800,color:"#15803d",marginBottom:4}}>
            {myClass}반 기록 저장 완료!
          </div>
          <div style={{fontSize:24,fontWeight:900,color:"#37352f",marginBottom:4}}>{countVal}개</div>
          <div style={{fontSize:12,color:"#9ca3af",marginBottom:12}}>실시간으로 반영되었습니다</div>
          <button onClick={()=>{setJudgeStep("login");setPwdInput("");setMyClass(null);setCountVal("");}}
            className="obtn" style={{fontSize:13,padding:"8px 20px"}}>다른 반 입력하기</button>
        </div>
      </>)}
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  EightMusicPlayer: 8자마라톤 음원 재생기
//  - 운영자가 BGM에 등록한 음원 또는 Firebase storage URL 사용
//  - state.eightAudio = { "1학년 8자마라톤": "url", "2학년 8자마라톤": "url" }
// ════════════════════════════════════════════════════════
function EightMusicPlayer({ sport, state }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [duration, setDuration] = useState(0);

  const audioUrl = state.eightAudio?.[sport] || "";

  const toggle = () => {
    const a = audioRef.current;
    if(!a) return;
    if(playing) { a.pause(); setPlaying(false); }
    else { a.play().then(()=>setPlaying(true)).catch(e=>alert("재생 실패: "+e.message)); }
  };

  const restart = () => {
    const a = audioRef.current;
    if(!a) return;
    a.currentTime = 0;
    a.play().then(()=>setPlaying(true)).catch(()=>{});
  };

  const onTimeUpdate = () => {
    const a = audioRef.current;
    if(!a) return;
    setProgress(a.currentTime);
    setDuration(a.duration||0);
  };

  const onEnded = () => { setPlaying(false); setProgress(0); };

  const fmt = (s) => {
    if(!s||isNaN(s)) return "0:00";
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return `${m}:${sec.toString().padStart(2,"0")}`;
  };

  if(!audioUrl) {
    return (
      <div style={{fontSize:12,color:"#9b9a97",fontWeight:600,padding:"4px 10px",
        background:"#fafaf9",borderRadius:6,border:"1px dashed #e7e7e5"}}>
        🎵 음원 미등록 (운영자 BGM 메뉴에서 등록)
      </div>
    );
  }

  return (
    <div style={{
      display:"flex",alignItems:"center",gap:8,
      padding:"6px 10px 6px 6px",
      background:"linear-gradient(135deg,#fef3c7,#fde68a)",
      borderRadius:24,
      border:"2px solid #f59e0b"
    }}>
      <button onClick={toggle} style={{
        width:36,height:36,borderRadius:"50%",border:"none",
        background:playing?"#dc2626":"#16a34a",color:"#fff",
        cursor:"pointer",fontSize:14,fontWeight:900,
        display:"flex",alignItems:"center",justifyContent:"center",
        boxShadow:"0 2px 6px rgba(0,0,0,.15)"
      }}>
        {playing?"⏸":"▶"}
      </button>
      <button onClick={restart} style={{
        width:30,height:30,borderRadius:"50%",border:"none",
        background:"#fff",color:"#92400e",
        cursor:"pointer",fontSize:13,fontWeight:900,
        display:"flex",alignItems:"center",justifyContent:"center"
      }}>↺</button>
      <div style={{fontSize:13,fontFamily:"monospace",fontWeight:800,color:"#92400e",
        minWidth:80,letterSpacing:"-.5px"}}>
        {fmt(progress)} / {fmt(duration)}
      </div>
      <audio ref={audioRef} src={audioUrl}
        onTimeUpdate={onTimeUpdate} onEnded={onEnded}
        preload="metadata"/>
    </div>
  );
}

          🥉 3위 (준결승 ① 패자) <b>80점</b> · 4위 (준결승 ② 패자) <b>80점</b><br/>
          5위 (1라운드 패자) <b>50점</b><br/>
          <b>대진:</b> 1번 시드 부전승 · 2 vs 3 → 승자 vs 1번 / 4 vs 5 → 결승
        </div>
      </div>

      {/* 대진표 - 항상 표시 */}
      <div className="sl">🪢 대진표</div>
      <TugTreeSVG seeds={seeds} results={results} onPick={null}/>

      {/* 추첨 전 안내 */}
      {!hasBracket && (
        <div className="card" style={{textAlign:"center",padding:"24px 20px",
          background:"#fffbeb",borderColor:"#fde68a",marginTop:10}}>
          <div style={{fontSize:32,marginBottom:8}}>🎰</div>
          <div style={{fontWeight:800,fontSize:15,color:"#92400e"}}>
            아직 대진 추첨 전입니다
          </div>
          <div style={{fontSize:13,color:"#a16207",marginTop:4}}>
            운영자가 시드 추첨을 완료하면 대진이 채워집니다
          </div>
        </div>
      )}

      {/* 결과 순위 */}
      {rankList && rankList.length>0 && (
        <>
          <div className="sl">🏆 최종 순위</div>
          <div className="card">
            {rankList.map(([t,rank])=>(
              <div key={t} className="rrow">
                <span className="rrow-rank">
                  {rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":`${rank}위`}
                </span>
                <TeamBadge team={t} size={28}/>
                <span className="rrow-main">{t}팀</span>
                <Chip color={TEAM_COLORS[t]} bg={TEAM_BG[t]}>
                  {(SPORT_PTS[sel]||[])[rank-1]||0}점
                </Chip>
              </div>
            ))}
          </div>
        </>
      )}
    </>);
  }

  // ── 피지컬100 ──
  if(sel==="피지컬100") {
    const p=state.p100||{};
    const stats=gk=>{
      const r1=p.r1?.[gk]||{};
      const elim=p.r2elim?.[gk]||[];
      const r3=p.r3?.[gk]||{};
      const qualifiers=Object.entries(r1).filter(([,w])=>w?.cls);
      const survivors=qualifiers.filter(([hk])=>!elim.includes(hk));
      const champion=r3.final&&r1[r3.final]?.cls?r1[r3.final]:null;
      return{qualifiers,survivors,champion};
    };
    const sM=stats("m"),sF=stats("f");
    if(!sM.qualifiers.length&&!sF.qualifiers.length) return <NotYet/>;
    return(<>
      {[{k:"m",l:"🏃‍♂️ 남자",s:sM},{k:"f",l:"🏃‍♀️ 여자",s:sF}].map(({k,l,s})=>(
        s.qualifiers.length>0&&(<div key={k} style={{marginBottom:14}}>
          <div className="sl">{l}</div>
          {s.champion&&(<div className="card" style={{background:"linear-gradient(135deg,#fbbf24,#f59e0b)",
            border:"none",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:30}}>🏆</span>
              <div><div style={{fontSize:11,fontWeight:700,color:"#78350f"}}>우승 +{P100_PTS.win}점</div>
                <div style={{fontSize:18,fontWeight:900,color:"#1c1917"}}>{s.champion.name}</div>
                <div style={{fontSize:12,color:"#78350f"}}>{s.champion.cls}반 ({classToTeam(s.champion.cls)}팀)</div>
              </div>
            </div>
          </div>)}
          <div className="card">
            {s.qualifiers.map(([hk,w])=>{
              const team=classToTeam(w.cls);
              const isElim=!s.survivors.find(([h])=>h===hk);
              return(<div key={hk} className="rrow" style={{opacity:isElim?.55:1}}>
                <TeamBadge team={team} size={26}/>
                <span style={{flex:1,fontSize:13,color:"#37352f"}}>{w.name}
                  <span style={{fontSize:11,color:"#9b9a97",marginLeft:4}}>({w.cls}반)</span>
                </span>
                <span style={{fontSize:11,color:isElim?"#9b9a97":"#16a34a",fontWeight:600}}>
                  {isElim?"2차탈락":"3차진출"}
                </span>
              </div>);
            })}
          </div>
        </div>)
      ))}
    </>);
  }

  return <NotYet/>;
}



// ════════════════════════════════════════════════════════
//  LiveBriefing: 현재 종목 대진 기반 운영 안내
// ════════════════════════════════════════════════════════
function LiveBriefing({cur, next, state, pickSbTab, getTab}) {

  // 종목별 다음 준비 안내 메시지 생성
  const getBriefing = () => {
    if(!cur) return null;
    const t = cur.title;

    // ── 줄다리기 ──
    if(t.includes("줄다리기")) {
      const br = state.brackets?.["줄다리기"] || {};
      const seeds = br.seeds || [];
      const results = br.results || {};
      if(seeds.length >= 5) {
        const comp = compute5SpecialBracket(seeds, results);
        const [m1, sf1, sf2, mF] = comp.matches;
        const msgs = [];
        if(!m1.winner && seeds[1] && seeds[2])
          msgs.push({icon:"⚡", txt:`1라운드 준비`, sub:`${seeds[1]}팀 vs ${seeds[2]}팀 — 입장해주세요`});
        else if(m1.winner && !sf1.winner && seeds[0])
          msgs.push({icon:"⚡", txt:`준결승 ① 준비`, sub:`${seeds[0]}팀(부전승) vs ${m1.winner}팀 — 입장해주세요`});
        else if(m1.winner && !sf2.winner && seeds[3] && seeds[4])
          msgs.push({icon:"⚡", txt:`준결승 ② 준비`, sub:`${seeds[3]}팀 vs ${seeds[4]}팀 — 입장해주세요`});
        else if(sf1.winner && sf2.winner && !mF.winner)
          msgs.push({icon:"🏆", txt:`결승 준비`, sub:`${sf1.winner}팀 vs ${sf2.winner}팀 — 결승 입장해주세요`});
        else if(mF.winner)
          msgs.push({icon:"🎉", txt:`경기 종료`, sub:`우승: ${mF.winner}팀 — 시상 준비`});
        if(msgs.length) return msgs;
      }
      return [{icon:"🪢", txt:"줄다리기 진행 중", sub:"대진 추첨 후 안내가 표시됩니다"}];
    }

    // ── 8자마라톤 ──
    if(t.includes("8자마라톤")) {
      const sp = t.includes("1학년") ? "1학년 8자마라톤" : "2학년 8자마라톤";
      const counts = state.timeTrial?.[sp] || {};
      const done = Object.keys(counts).length;
      const total = 10; // 학급 수
      if(done >= total)
        return [{icon:"✅", txt:"전 학급 기록 완료", sub:"결과 페이지에서 순위를 확인하세요"}];
      if(done > 0)
        return [{icon:"⏱", txt:`${done}/${total}반 완료`, sub:`다음: ${done+1}반 준비해주세요`}];
      return [{icon:"⏱", txt:"기록 측정 대기 중", sub:"1반부터 순서대로 준비해주세요"}];
    }

    // ── 장애물달리기 / 태풍의 눈 ──
    if(t.includes("장애물") || t.includes("태풍")) {
      const sp = t.includes("장애물") ? "장애물달리기" : "태풍의눈";
      const isTyp2 = sp === "태풍의눈";
      const gs = state.groupScores?.[sp] || {};
      const KEYS2 = isTyp2 ? TYP_KEYS : GRP_KEYS;
      const total = isTyp2 ? 5 : 4;
      const perGroup = isTyp2 ? 4 : 5;
      const done = KEYS2.filter(k => Object.keys(gs[k]||{}).length >= perGroup).length;
      const nextG = KEYS2.findIndex(k => Object.keys(gs[k]||{}).length < perGroup);
      const gNames = isTyp2
        ? ["1조","2조","3조","4조","5조"]
        : ["1학년 A조","1학년 B조","2학년 A조","2학년 B조"];
      if(done >= total)
        return [{icon:"✅", txt:"전 조 완료", sub:"결과 집계 중입니다"}];
      if(nextG >= 0)
        return [{icon:"⚡", txt:`${gNames[nextG]} 경기 준비`, sub:`${gNames[nextG]} 참가 학급 입장해주세요 (${done}/${total}조 완료)`}];
      return [{icon:"🚀", txt:"진행 대기", sub:"조 편성 후 순서대로 진행합니다"}];
    }

    // ── 계주 ──
    if(t.includes("계주")) {
      const rf = state.relayFinals || {};
      const gs = state.groupScores?.["계주"] || {};
      const isF = t.includes("결승");
      if(isF) {
        const gradesDone = ["grade1","grade2"].filter(g=>rf[g]&&Object.keys(rf[g]).length>=4).length;
        if(gradesDone >= 2)
          return [{icon:"🏁", txt:"결승 완료", sub:"1·2학년 계주 결승 종료"}];
        const nextGrade = !rf["grade1"]||Object.keys(rf["grade1"]||{}).length<4 ? "1학년" : "2학년";
        return [{icon:"🏁", txt:`${nextGrade} 계주 결승`, sub:`${nextGrade} 결승 진출팀 입장해주세요`}];
      }
      const GK = ["g1","g2","g3","g4"];
      const done = GK.filter(k=>Object.keys(gs[k]||{}).length>=4).length;
      return [{icon:"🏃", txt:`예선 진행 중 (${done}/4조)`, sub:done<4?`${done+1}조 준비해주세요`:"예선 완료 · 결선 준비"}];
    }

    // ── 피지컬100 ──
    if(t.includes("피지컬")) {
      const p = state.p100 || {};
      const r1m = Object.keys(p.r1?.m||{}).length;
      const r1f = Object.keys(p.r1?.f||{}).length;
      if(!r1m && !r1f)
        return [{icon:"🏋️", txt:"피지컬100 시작 대기", sub:"1차전 참가자 번호 확인 후 입장해주세요"}];
      return [{icon:"💪", txt:`1차 통과 — 남 ${r1m}명 · 여 ${r1f}명`, sub:"다음 라운드 대기자 준비해주세요"}];
    }

    // ── 골때녀 ──
    if(t.includes("골때녀")) {
      const gd = state.golddanya || {};
      const h1 = gd.half1 || {}, h2 = gd.half2 || {};
      const msgs = [];
      if(h1.status==="upcoming") msgs.push({icon:"⚽", txt:"전반전 준비", sub:"교사팀 vs 1학년 — 선수 입장해주세요"});
      else if(h1.status==="live") msgs.push({icon:"🔴", txt:`전반전 진행 중`, sub:`교사 ${h1.score?.teacher||0} : ${h1.score?.student||0} 1학년`});
      else if(h2.status==="upcoming") msgs.push({icon:"⚽", txt:"후반전 준비", sub:"교사팀 vs 2학년 — 선수 입장해주세요"});
      else if(h2.status==="live") msgs.push({icon:"🔴", txt:`후반전 진행 중`, sub:`교사 ${h2.score?.teacher||0} : ${h2.score?.student||0} 2학년`});
      else msgs.push({icon:"⚽", txt:"골때녀 이벤트", sub:"경기 운영자 안내에 따라 진행합니다"});
      return msgs;
    }

    // ── 응원전 ──
    if(t.includes("응원전")) {
      const grade = t.includes("1학년") ? "1학년" : t.includes("2학년") ? "2학년" : "";
      return [{icon:"📣", txt:`${grade} 응원전 진행 중`, sub:"채점단 준비 · 채점탭에서 점수 입력하세요"}];
    }

    // ── 미션달리기 ──
    if(t.includes("미션")) {
      return [{icon:"🎯", txt:"미션달리기 이벤트", sub:"학생회 진행 · 참가 학생 운동장 집결해주세요"}];
    }

    return null;
  };

  const briefs = getBriefing();
  const tab = cur ? getTab(cur.title) : null;

  if(!cur) {
    // 경기 전 — 다음 종목 안내
    return (
      <div style={{background:"#f8fafc",borderRadius:12,padding:"16px",
        marginBottom:10,border:"1px solid #e2e8f0"}}>
        <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,letterSpacing:2,marginBottom:8}}>
          경기 준비 중
        </div>
        {next ? (
          <div style={{display:"flex",alignItems:"center",gap:12}}
            onClick={()=>{const t=getTab(next.title);if(t&&pickSbTab)pickSbTab(t);}}
            style={{cursor: getTab(next?.title)&&pickSbTab?"pointer":"default",
              display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:36}}>{next.emoji}</span>
            <div>
              <div style={{fontSize:12,color:"#64748b",fontWeight:600,marginBottom:2}}>
                다음 종목 · {next.time}
              </div>
              <div style={{fontSize:18,fontWeight:800,color:"#1e293b"}}>{next.title}</div>
              <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>
                참가 선수·학급은 미리 준비해주세요
              </div>
            </div>
          </div>
        ) : (
          <div style={{color:"#94a3b8",fontSize:14,textAlign:"center",padding:"8px 0"}}>
            오늘 일정이 시작되기를 기다리고 있습니다
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="dash-now"
      onClick={()=>{ if(tab&&pickSbTab) pickSbTab(tab); }}
      style={{cursor: tab&&pickSbTab?"pointer":"default",marginBottom:10}}>

      {/* 헤더 */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <span className="blink" style={{width:8,height:8,borderRadius:"50%",
          background:"#ef4444",flexShrink:0,display:"inline-block"}}/>
        <span style={{fontSize:11,color:"rgba(255,255,255,.6)",fontWeight:700,letterSpacing:2,flex:1}}>
          NOW PLAYING
        </span>
        <span style={{fontSize:20}}>{cur.emoji}</span>
        <span style={{fontSize:15,fontWeight:800,color:"#fff"}}>{cur.title}</span>
        {tab && pickSbTab && (
          <span style={{fontSize:11,color:"rgba(255,255,255,.45)",marginLeft:4}}>›</span>
        )}
      </div>

      {/* 대진 안내 */}
      {briefs && briefs.map((b,i)=>(
        <div key={i} style={{background:"rgba(255,255,255,.12)",borderRadius:10,
          padding:"12px 14px",marginBottom: i<briefs.length-1?8:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:24,flexShrink:0}}>{b.icon}</span>
            <div>
              <div style={{fontSize:15,fontWeight:800,color:"#fff",lineHeight:1.2}}>
                {b.txt}
              </div>
              <div style={{fontSize:13,color:"rgba(255,255,255,.75)",marginTop:3,
                lineHeight:1.4,fontWeight:500}}>
                {b.sub}
              </div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function VDash({cur, next, ranked, state, pickSbTab}) {
  const [schedOpen, setSchedOpen] = useState(true);

  // 일정 제목 → sbTab ID 매핑
  const TITLE_TO_TAB = {
    "1학년 8자마라톤":  "1학년 8자마라톤",
    "2학년 8자마라톤":  "2학년 8자마라톤",
    "줄다리기":         "줄다리기",
    "장애물달리기":     "장애물달리기",
    "태풍의 눈":        "태풍의 논",
    "계주":             "계주",
    "미션달리기":       "미선달리기 (이벤트)",
    "피지컬100":        "피지컬100",
    "골때녀":           "골때녀",
    "입장식":           "entry",
    "응원전":           "cheershow",
  };

  return(<>
    {/* ── 라이브 운영 안내 ── */}
    <LiveBriefing cur={cur} next={next} state={state} pickSbTab={pickSbTab} getTab={getTab}/>

          borderBottom: schedOpen?"1px solid #ebebea":"none",cursor:"pointer"}}>
        <span style={{fontSize:15}}>📅</span>
        <span style={{fontWeight:700,color:"#37352f",fontSize:14,flex:1}}>오늘 일정</span>
        <span style={{fontSize:12,color:"#9b9a97",fontWeight:600,
          background:"#f3f4f6",padding:"3px 10px",borderRadius:8}}>
          {schedOpen ? "접기 ▴" : "펼치기 ▾"}
        </span>
      </div>
      {schedOpen && <div>
        {(state.schedule||[]).map((s,i)=>{
            const isDone = s.status==="done";
            const isCur  = s.status==="current";
            const tab    = getTab(s.title);
            const canNav = !!tab && !!pickSbTab;
            return(
              <div key={s.id}
                onClick={canNav ? ()=>pickSbTab(tab) : undefined}
                style={{
                  display:"flex",alignItems:"center",gap:12,padding:"14px 16px",
                  borderBottom: i<(state.schedule||[]).length-1?"1px solid #f5f5f3":"none",
                  background: isCur?"#fffbf0":isDone?"#fafaf9":"#fff",
                  opacity: isDone?0.55:1,
                  cursor: canNav?"pointer":"default",
                  transition:"background .12s",
                }}
                onMouseEnter={e=>{if(canNav)e.currentTarget.style.background=isCur?"#fef3c7":"#f5f5f3"}}
                onMouseLeave={e=>{if(canNav)e.currentTarget.style.background=isCur?"#fffbf0":isDone?"#fafaf9":"#fff"}}
              >
                <span style={{
                  fontSize:16,fontWeight:900,fontFamily:"monospace",
                  color:isDone?"#787671":"#fff",
                  background:isCur?"#eb5757":isDone?"#f3f4f6":"#1f2937",
                  padding:"6px 10px", borderRadius:8,
                  minWidth:72,flexShrink:0,letterSpacing:"-.5px",
                  textAlign:"center"
                }}>{s.time}</span>
                <span style={{fontSize:22,flexShrink:0}}>{s.emoji}</span>
                <span style={{flex:1,fontSize:16,fontWeight:isCur?800:700,
                  color:isCur?"#92400e":"#37352f",
                  textDecoration:isDone?"line-through":"none"}}>
                  {s.title}
                </span>
                {isCur&&<span className="blink" style={{fontSize:12,fontWeight:900,
                  color:"#fff",background:"#eb5757",padding:"3px 9px",borderRadius:10,
                  letterSpacing:1,flexShrink:0}}>LIVE</span>}
                {isDone&&!canNav&&<span style={{fontSize:14,color:"#9b9a97",flexShrink:0}}>✓</span>}
                {isDone&&canNav&&<span style={{fontSize:13,color:"#9b9a97",flexShrink:0}}>{"✓ ›"}</span>}
                {!isDone&&!isCur&&canNav&&(
                  <span style={{fontSize:12,color:"#9b9a97",flexShrink:0,
                    background:"#f3f4f6",padding:"3px 8px",borderRadius:8,
                    fontWeight:600}}>바로가기 ›</span>
                )}
              </div>
            );
          })}
      </div>}
    </div>

    {/* ── 팀 종합순위 ── */}
    <div className="sl">🏆 팀 종합순위</div>
    {ranked.map((r,i)=>(
      <div key={r.team} className={`rank-row${i===0?" r1":i===1?" r2":""}`}
        style={{padding:"14px 16px"}}>

          {i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}위`}

      <span style={keywordStyle}>같이</span>
      <span style={{color:"#d4d4d2",fontSize:size*0.7,fontWeight:200}}>·</span>

}



// 응원전 점수 집계 (13명 심판 → 팀별 평균)
function computeCheerTotals(cheerData, revealCheer) {
  // cheerData = { "교장_이재성": {scores: {"1-1":{flag,uniform,entry,daily,order,cheer}, ...}}, ... }
  // revealCheer: true면 응원전(cheer) 점수도 합계에 포함 (운영자 공개 후)
  if(!cheerData) return null;
  const judgeEntries = Object.entries(cheerData);
  if(judgeEntries.length===0) return null;

  // 학급별 카테고리 합계
  const classStats = {};
  for(const cls of ALL_CLASSES) {
    classStats[cls] = {flag:0, uniform:0, entry:0, daily:0, order:0, cheer:0,
                       count:0, totalSumVisible:0, totalSumWithHidden:0};
  }

  // 각 심판 진행 추적
  const judgeProgress = {};
  for(const j of CHEER_JUDGES) {
    for(const n of j.names) {
      judgeProgress[`${j.dept}_${n}`] = {dept:j.dept, name:n, classCount:0, submitted:false};
    }
  }

  let participatingJudges = 0;
  for(const [judgeId, judge] of judgeEntries) {
    const sc = judge.scores || {};
    let judgeClassCount = 0;
    for(const cls of ALL_CLASSES) {
      const cs = sc[cls];
      if(cs && (cs.flag||cs.uniform||cs.entry||cs.daily||cs.order||cs.cheer)) {
        classStats[cls].flag    += (cs.flag||0);
        classStats[cls].uniform += (cs.uniform||0);
        classStats[cls].entry   += (cs.entry||0);
        classStats[cls].daily   += (cs.daily||0);
        classStats[cls].order   += (cs.order||0);
        classStats[cls].cheer   += (cs.cheer||0);
        classStats[cls].count++;
        // 공개된 카테고리 합계 (히든 제외)
        classStats[cls].totalSumVisible += (cs.flag||0)+(cs.uniform||0)+(cs.entry||0)+(cs.daily||0)+(cs.order||0);
        // 전체 합계 (히든 포함)
        classStats[cls].totalSumWithHidden += (cs.flag||0)+(cs.uniform||0)+(cs.entry||0)+(cs.daily||0)+(cs.order||0)+(cs.cheer||0);
        judgeClassCount++;
      }
    }
    if(judgeClassCount>0) {
      participatingJudges++;
      if(judgeProgress[judgeId]) {
        judgeProgress[judgeId].classCount = judgeClassCount;
        judgeProgress[judgeId].submitted = judgeClassCount >= ALL_CLASSES.length;
      }
    }
  }

  // 학급별 평균
  const classScores = ALL_CLASSES.map(cls=>{
    const cs = classStats[cls];
    const cnt = Math.max(cs.count, 1);
    const totalSum = revealCheer ? cs.totalSumWithHidden : cs.totalSumVisible;
    return {
      cls,
      team: classToTeam(cls),
      grade: cls.split("-")[0],
      avgFlag:    cs.flag/cnt,
      avgUniform: cs.uniform/cnt,
      avgEntry:   cs.entry/cnt,
      avgDaily:   cs.daily/cnt,
      avgOrder:   cs.order/cnt,
      avgCheer:   cs.cheer/cnt,
      avgTotal:   totalSum/cnt,
      avgVisible: cs.totalSumVisible/cnt,
      avgWithHidden: cs.totalSumWithHidden/cnt,
      totalSum,
      judgeCount: cs.count
    };
  });

  // 학년별 정렬 (현재 합계 기준)
  const gradeRankings = {};
  for(const grade of ["1","2"]) {
    gradeRankings[grade] = classScores
      .filter(c=>c.grade===grade)
      .sort((a,b)=>b.avgTotal-a.avgTotal);
  }

  return {
    classScores,
    gradeRankings,
    participatingJudges,
    totalJudges: CHEER_JUDGES.length,
    judgeProgress: Object.values(judgeProgress),
    revealCheer: !!revealCheer
  };
}

function VCheer({state}) {
  // 운영자가 설정한 응원전 공개 여부
  const revealCheer = state?.cheerReveal === true;
  const result = computeCheerTotals(state?.cheer, revealCheer);

  // Flip 애니메이션을 위한 이전 위치 기록
  const prevPositions = useRef({});
  const itemRefs = useRef({});

  // 순위 변동 감지용 키 (deps)
  const rankKey = result ? JSON.stringify(
    Object.fromEntries(
      ["1","2"].map(g=>[g, (result.gradeRankings?.[g]||[]).map(c=>c.cls)])
    )
  ) : "";

  useEffect(()=>{
    // 새 위치 측정 → 이전 위치와 비교 → 차이만큼 즉시 이동 후 0으로 transition
    Object.keys(itemRefs.current).forEach(key=>{
      const el = itemRefs.current[key];
      if(!el) return;
      try {
        const newRect = el.getBoundingClientRect();
        const prev = prevPositions.current[key];
        if(prev) {
          const dy = prev.top - newRect.top;
          if(Math.abs(dy)>2) {
            el.style.transform = `translateY(${dy}px)`;
            el.style.transition = "none";
            requestAnimationFrame(()=>{
              el.style.transform = "";
              el.style.transition = "transform .55s cubic-bezier(.4,1.4,.5,1)";
            });
          }
        }
        prevPositions.current[key] = {top:newRect.top};
      } catch(e) { /* DOM 측정 실패 시 무시 */ }
    });
  }, [rankKey]);

  if(!result || result.participatingJudges===0) {
    return(<>
      <div className="card" style={{textAlign:"center",padding:40,color:"#9ca3af",marginTop:6}}>
        <div style={{fontSize:36,marginBottom:10}}>⏳</div>
        <div style={{fontSize:14,fontWeight:700,color:"#37352f",marginBottom:4}}>
          응원전 채점 시작 전

        <div style={{fontSize:12}}>
          심판 선생님들이 채점을 시작하면 실시간으로 순위가 변동됩니다
        </div>
      </div>
    </>);
  }

  const { gradeRankings, participatingJudges, totalJudges } = result;

  // 학급 카드 (블록 1개)
  const ClassBlock = ({cs, rank, grade}) => {
    const isTop = rank===0;
    const isPodium = rank<3;
    const team = cs.team;
    return (
      <div ref={el=>itemRefs.current[`${grade}_${cs.cls}`]=el}
        style={{
          background: isTop
            ? "linear-gradient(135deg,#fef9c3,#fffef0)"
            : "#fff",
          border: `1px solid ${isTop?"#facc15":"#e5e7eb"}`,
          borderLeft: `5px solid ${TEAM_COLORS[team]}`,
          borderRadius: 8,
          padding: "10px 12px",
          marginBottom: 8,
          display: "flex", alignItems: "center", gap: 10,
          willChange: "transform"
        }}>
        <div style={{minWidth:30,textAlign:"center",fontSize:20}}>
          {isPodium ? (rank===0?"🥇":rank===1?"🥈":"🥉") : (
            <span style={{fontSize:13,color:"#787671",fontWeight:700}}>{rank+1}</span>
          )}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:900,fontSize:15,color:"#111827",
            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            {cs.cls}반
          </div>
          <div style={{fontSize:10,color:TEAM_COLORS[team],fontWeight:700,marginTop:1}}>
            {team}팀
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontWeight:900,fontSize:20,color:TEAM_COLORS[team],lineHeight:1,
            fontFamily:"system-ui,monospace"}}>
            {cs.avgTotal.toFixed(1)}
          </div>
          <div style={{fontSize:9,color:"#9ca3af",marginTop:1}}>/100</div>
        </div>
      </div>
    );
  };

  return(<>
    {/* 채점 진행 + 응원전 히든 표시 */}
    <div className="card" style={{background:"#eff6ff",borderColor:"#bfdbfe",
      marginBottom:12,padding:"10px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:22}}>⭐</span>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:800,color:"#1d4ed8"}}>
            실시간 응원전 순위 {revealCheer ? "(최종)" : "(중간)"}
          </div>
          <div style={{fontSize:11,color:"#1e40af",marginTop:2}}>
            심판 {participatingJudges}/{totalJudges}명 채점 중
            {!revealCheer && " · 🔒 응원전(30점) 비공개"}
          </div>
        </div>
      </div>
    </div>

    {/* 카테고리 진행 표시 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:4,marginBottom:14}}>
      {CHEER_CATS.map(cat=>{
        const isHidden = cat.hidden && !revealCheer;
        return (
          <div key={cat.id} style={{
            background:isHidden?"#fef2f2":"#f9fafb",
            border:`1px solid ${isHidden?"#fecaca":"#e5e7eb"}`,
            borderRadius:6,padding:"6px 4px",textAlign:"center"
          }}>
            <div style={{fontSize:9,color:isHidden?"#b91c1c":"#787671",fontWeight:700}}>
              {isHidden && "🔒 "}{cat.label}
            </div>
            <div style={{fontSize:11,color:isHidden?"#dc2626":"#37352f",fontWeight:800,marginTop:1}}>
              {cat.max}점
            </div>

        );
      })}
    </div>

    {/* 좌(1학년) / 우(2학년) 2단 */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {["1","2"].map(grade=>{
        const ranks = gradeRankings[grade]||[];
        return (
          <div key={grade}>
            <div style={{fontSize:13,fontWeight:800,color:"#37352f",
              padding:"6px 0",marginBottom:6,textAlign:"center",
              background:"#f3f4f6",borderRadius:6}}>
              🏆 {grade}학년
            </div>
            {ranks.length===0 ? (
              <div style={{textAlign:"center",color:"#9ca3af",padding:20,fontSize:12}}>
                채점 대기
              </div>
            ) : ranks.map((cs,i)=>(
              <ClassBlock key={cs.cls} cs={cs} rank={i} grade={grade}/>
            ))}
          </div>
        );
      })}
    </div>

    {/* 응원전 공개 알림 */}
    {revealCheer && (
      <div className="card" style={{
        marginTop:14,background:"linear-gradient(135deg,#fff7ed,#fef3c7)",
        borderColor:"#f59e0b",borderWidth:2,padding:"12px 14px",textAlign:"center"
      }}>
        <div style={{fontSize:24,marginBottom:4}}>🎭</div>
        <div style={{fontSize:13,fontWeight:800,color:"#854f0b"}}>
          응원전 점수 공개! 최종 순위가 확정되었습니다
        </div>
      </div>
    )}
  </>);
}

function VCheerScore({state}) {
  const [step, setStep] = useState("pwd"); // pwd | select | score
  const [dept, setDept] = useState("");
  const [name, setName] = useState("");
  const [pwd, setPwd] = useState("");
  const [errMsg, setErrMsg] = useState("");
  const [grade, setGrade] = useState("1"); // 1 | 2
  const [saving, setSaving] = useState(false);

  // 순위 입력 상태: {grade: {catId: {rank: clsName}}}
  // 예: {"1": {"flag": {1:"1-3", 2:"1-7", ...}}, ...}
  const [ranks, setRanks] = useState({});

  // 1단계: 비번 검증
  const checkPwd = () => {
    if(!pwd) { setErrMsg("비밀번호를 입력해주세요"); return; }
    const validPwds = ["yj2026"];
    if(!validPwds.includes(pwd.toLowerCase().trim())) {
      setErrMsg("비밀번호가 올바르지 않습니다");
      return;
    }
    setErrMsg("");
    setStep("select");
  };

  // 2단계: 부서/이름 선택 → 채점 시작
  const startScoring = async () => {
    if(!dept) { setErrMsg("소속 부서를 선택해주세요"); return; }
    if(!name) { setErrMsg("이름을 선택해주세요"); return; }
    setErrMsg("");

    // Firebase에서 기존 점수 불러오기 (재채점)
    try {
      const judgeId = `${dept}_${name}`;
      const url = `${window.FIREBASE_URL}/cheer/${encodeURIComponent(judgeId)}.json`;
      const res = await fetch(url);
      const data = await res.json();
      if(data && data.ranks) setRanks(data.ranks);
      else if(data && data.scores) {
        // 구버전 (점수 직접 입력) 데이터 → 순위로 변환 안 함, 빈 상태로 시작
        setRanks({});
      }
    } catch(e) { console.warn("점수 불러오기 실패:", e); }

    setStep("score");
  };

  // 순위에 학급 배치 (해당 학급이 다른 슬롯에 있으면 제거)
  const setRank = (cat, rank, cls) => {
    setRanks(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if(!next[grade]) next[grade] = {};
      if(!next[grade][cat]) next[grade][cat] = {};
      // 같은 학급이 다른 순위에 있으면 제거
      for(const r in next[grade][cat]) {
        if(next[grade][cat][r] === cls) delete next[grade][cat][r];
      }
      if(cls) next[grade][cat][rank] = cls;
      else delete next[grade][cat][rank];
      return next;
    });
  };

  // 순위 → 점수 변환 (1~4위 지정, 나머지 동점)
  // 1위=max, 2위=max*0.9, 3위=max*0.8, 4위=max*0.7, 나머지=max*0.6
  const TOP_RANK = 4;
  const rankToScore = (max, rank) => Math.round(max * (11 - rank) / 10);
  const tieScore   = (max) => Math.round(max * 6 / 10); // 5위 동점

  // 저장: 1~4위 배치 + 나머지는 동점(tieScore)
  const save = async () => {
    setSaving(true);
    try {
      const scores = {};
      for(const g of ["1","2"]) {
        const gradeRanks = ranks[g] || {};
        const gradeClasses = ALL_CLASSES.filter(c=>c.startsWith(g+"-"));
        for(const cat of CHEER_CATS) {
          const catRanks = gradeRanks[cat.id] || {};
          const ranked = Object.values(catRanks).filter(Boolean);
          const unranked = gradeClasses.filter(c=>!ranked.includes(c));
          // 1~4위 점수
          for(const rank in catRanks) {
            const cls = catRanks[rank];
            if(!cls) continue;
            if(!scores[cls]) scores[cls] = {};
            scores[cls][cat.id] = rankToScore(cat.max, parseInt(rank));
          }
          // 나머지 동점
          for(const cls of unranked) {
            if(!scores[cls]) scores[cls] = {};
            scores[cls][cat.id] = tieScore(cat.max);
          }
        }
      }

      const judgeId = `${dept}_${name}`;
      const payload = { dept, name, ranks, scores, updatedAt: Date.now() };
      const url = `${window.FIREBASE_URL}/cheer/${encodeURIComponent(judgeId)}.json`;
      const res = await fetch(url, {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error("저장 실패");
      alert("✅ 채점이 저장되었습니다");
    } catch(e) {
      alert("저장 실패: " + e.message);
    }
    setSaving(false);
  };

  // ════ 1단계: 비밀번호 ════
  if(step==="pwd") return(<>
    <div className="page-title">⭐ 응원전 채점</div>
    <div className="page-desc">응원전 심판 선생님 전용 채점 화면</div>

    <div className="card" style={{marginTop:14, padding:"24px 18px"}}>
      <div style={{textAlign:"center",marginBottom:16}}>
        <div style={{fontSize:42,marginBottom:8}}>🔐</div>
        <div style={{fontSize:15,fontWeight:800,color:"#37352f"}}>심사자 인증</div>
        <div style={{fontSize:12,color:"#787671",marginTop:4}}>운영자에게 받은 비밀번호 입력</div>
      </div>
      <input type="password" value={pwd}
        onChange={e=>setPwd(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&checkPwd()}
        placeholder="비밀번호"
        className="oinput"
        style={{marginBottom:10,textAlign:"center",fontSize:18,letterSpacing:2,padding:"12px"}}/>
      {errMsg && <div style={{color:"#dc2626",fontSize:12,textAlign:"center",marginBottom:10}}>{errMsg}</div>}
      <button onClick={checkPwd} className="obtn primary"
        style={{width:"100%",padding:"12px",fontSize:15,fontWeight:800}}>
        🔓 채점 시작
      </button>
    </div>
  </>);

  // ════ 2단계: 부서/이름 선택 ════
  if(step==="select") return(<>
    <div className="page-title">⭐ 응원전 채점</div>
    <div className="page-desc">소속과 이름을 선택해주세요</div>

    <div className="card" style={{marginTop:14}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:"#37352f"}}>소속 부서</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
        {CHEER_JUDGES.map(j=>(
          <button key={j.dept}
            onClick={()=>{setDept(j.dept);setName("");}}
            className="obtn"
            style={{
              padding:"10px 8px",fontSize:13,
              background:dept===j.dept?"#37352f":"#fff",
              color:dept===j.dept?"#fff":"#37352f",
              border:`1.5px solid ${dept===j.dept?"#37352f":"#e7e7e5"}`,
              fontWeight:dept===j.dept?800:600
            }}>{j.dept}</button>
        ))}
      </div>

      {dept && (<>
        <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:"#37352f"}}>이름</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
          {dept && CHEER_JUDGES.find(j=>j.dept===dept)?.names.map(n=>(
            <button key={n}
              onClick={()=>setName(n)}
              className="obtn"
              style={{
                padding:"10px 16px",fontSize:14,
                background:name===n?"#f59e0b":"#fff",
                color:name===n?"#fff":"#37352f",
                border:`1.5px solid ${name===n?"#f59e0b":"#e7e7e5"}`,
                fontWeight:name===n?800:600
              }}>{n}</button>
          ))}
        </div>
      </>)}

      {errMsg && <div style={{color:"#dc2626",fontSize:12,marginBottom:8}}>{errMsg}</div>}
      <button onClick={startScoring} className="obtn primary"
        style={{width:"100%",padding:12,fontSize:14,fontWeight:800}}>
        ✏️ 채점 시작 →
      </button>
    </div>
  </>);

  // ════ 3단계: 1~4위 지정 채점 ════
  const gradeRanks = ranks[grade] || {};
  const gradeClasses = ALL_CLASSES.filter(c=>c.startsWith(grade+"-"));

  // 항목별 지정된 순위 수
  const progressByCat = {};
  for(const cat of CHEER_CATS) {
    progressByCat[cat.id] = Object.values(gradeRanks[cat.id]||{}).filter(v=>v).length;
  }

  return(<>
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",
      borderBottom:"1px solid #e5e7eb",marginBottom:12}}>
      <div style={{flex:1}}>
        <div style={{fontSize:11,color:"#787671"}}>{dept}</div>
        <div style={{fontSize:15,fontWeight:800,color:"#37352f"}}>👩‍🏫 {name} 선생님</div>
      </div>
      <button onClick={()=>{setStep("select");setName("");}}
        className="obtn" style={{fontSize:11,padding:"6px 10px"}}>로그아웃</button>
    </div>

    {/* 학년 탭 */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:12}}>
      {["1","2"].map(g=>(
        <button key={g} onClick={()=>setGrade(g)} className="obtn"
          style={{
            padding:"12px",fontSize:14,fontWeight:800,
            background:grade===g?"#3b82f6":"#fff",
            color:grade===g?"#fff":"#37352f",
            border:`1.5px solid ${grade===g?"#3b82f6":"#e7e7e5"}`
          }}>
          {g}학년
        </button>
      ))}
    </div>

    {/* 안내 */}
    <div className="card" style={{background:"#eff6ff",borderColor:"#bfdbfe",
      padding:"10px 14px",marginBottom:12}}>
      <div style={{fontSize:12,color:"#1e40af",lineHeight:1.7}}>
        💡 각 항목별로 <b>1~4위만 지정</b>하세요. 나머지 학급은 자동으로 <b>동점</b> 처리됩니다.<br/>
        <span style={{fontSize:11,color:"#3b82f6"}}>
          1위 100% · 2위 90% · 3위 80% · 4위 70% · <b>나머지 60% 동점</b>
        </span>
      </div>
    </div>

    {/* 항목별 세로 카드 */}
    <div style={{marginBottom:12}}>
      {CHEER_CATS.map(cat=>{
        const catRanks = gradeRanks[cat.id]||{};
        const usedClasses = Object.values(catRanks).filter(Boolean);
        const remaining = gradeClasses.filter(c=>!usedClasses.includes(c));
        const isHidden = cat.hidden;
        const done = progressByCat[cat.id];
        return (
          <div key={cat.id} className="card" style={{marginBottom:10,padding:"12px 14px",
            borderLeft:`4px solid ${isHidden?"#f87171":done>=TOP_RANK?"#22c55e":"#e5e7eb"}`}}>

            {/* 항목 헤더 */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
              <div style={{flex:1}}>
                <span style={{fontSize:14,fontWeight:800,
                  color:isHidden?"#b91c1c":"#37352f"}}>
                  {isHidden&&"🔒 "}{cat.label}
                </span>
                <span style={{fontSize:11,color:"#787671",marginLeft:8}}>
                  최고 {cat.max}점
                </span>
              </div>
              <span style={{fontSize:12,fontWeight:700,
                color:done>=TOP_RANK?"#16a34a":"#9ca3af"}}>
                {done}/{TOP_RANK}위 완료 {done>=TOP_RANK?"✅":""}
              </span>
            </div>

            {/* 1~4위 슬롯 (2열 그리드) */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
              {[1,2,3,4].map(rank=>{
                const cls = catRanks[rank]||"";
                const score = rankToScore(cat.max, rank);
                const medal = rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"4️⃣";
                const isFilled = !!cls;
                return(
                  <div key={rank} style={{
                    display:"flex",alignItems:"center",gap:6,
                    padding:"7px 10px",borderRadius:8,
                    background:isFilled?"#fef3c7":"#f9fafb",
                    border:`1.5px solid ${isFilled?"#fde68a":"#e5e7eb"}`}}>
                    <div style={{flexShrink:0,textAlign:"center",minWidth:32}}>
                      <div style={{fontSize:16,lineHeight:1}}>{medal}</div>
                      <div style={{fontSize:9,color:"#a16207",fontWeight:700,marginTop:1}}>
                        {score}점
                      </div>
                    </div>
                    <select value={cls}
                      onChange={e=>setRank(cat.id, rank, e.target.value)}
                      style={{
                        flex:1,fontSize:13,padding:"3px 2px",
                        border:"none",background:"transparent",
                        color:cls?"#37352f":"#9ca3af",
                        fontWeight:cls?700:400,fontFamily:"inherit",
                        cursor:"pointer",minWidth:0
                      }}>
                      <option value="">— 선택 —</option>
                      {gradeClasses.filter(c=>c===cls||!usedClasses.includes(c)).map(c=>(
                        <option key={c} value={c}>{c}반</option>
                      ))}
                    </select>
                  </div>
                );
              })}
            </div>

            {/* 나머지 동점 */}
            <div style={{
              padding:"7px 10px",borderRadius:8,
              background:"#f1f5f9",border:"1px solid #e2e8f0",
              display:"flex",alignItems:"center",gap:8}}>
              <div style={{flexShrink:0,fontSize:12,fontWeight:700,color:"#64748b",minWidth:64}}>
                나머지 동점<br/>
                <span style={{color:"#3b82f6",fontSize:13}}>{tieScore(cat.max)}점</span>
              </div>
              <div style={{fontSize:12,color:"#475569",lineHeight:1.6,fontWeight:600}}>
                {remaining.length>0
                  ? remaining.map(c=>c.split("-")[1]+"반").join("  ·  ")
                  : <span style={{color:"#94a3b8",fontWeight:400}}>없음</span>}
              </div>
            </div>
          </div>
        );
      })}
    </div>

    {/* 진행 + 저장 */}
    <div style={{position:"sticky",bottom:0,background:"#fff",
      padding:"10px 0",borderTop:"1px solid #e5e7eb",
      display:"flex",gap:8,alignItems:"center"}}>
      <div style={{flex:1,fontSize:11,color:"#787671",lineHeight:1.5}}>
        {grade}학년 진행<br/>
        {CHEER_CATS.map(c=>{
          const d=progressByCat[c.id];
          return <span key={c.id} style={{marginRight:6,
            color:d>=TOP_RANK?"#16a34a":"#787671",fontWeight:d>=TOP_RANK?700:400}}>
            {c.label.slice(0,2)} {d}/{TOP_RANK}
          </span>;
        })}
      </div>
      <button onClick={save} disabled={saving}
        className="obtn primary"
        style={{padding:"10px 20px",fontSize:14,fontWeight:800,flexShrink:0}}>
        {saving?"저장 중...":"💾 저장"}
      </button>
    </div>

    <div style={{height:30}}/>
  </>);
}
